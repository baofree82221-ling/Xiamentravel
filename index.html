<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>🧭 金門 x 廈門 尊榮深度探索手冊</title>
    
    <!-- 輕奢風格專用 CDN 函式庫 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- 輕量級高畫質地圖 Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        twilightBg: '#0B192C',     // 暮光深海暗藍
                        twilightSlate: '#1E3E62',  // 沉穩海藍灰
                        twilightSand: '#D4AD68',   // 溫潤暖沙金
                        twilightPaper: '#FAF9F6',  // 優雅石膏白紙
                        twilightMuted: '#64748B',  // 莫蘭迪石板灰
                        twilightCard: '#FFFFFF'    // 紙張純白
                    },
                    borderRadius: {
                        'luxury': '20px'
                    }
                }
            }
        }
    </script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap');
        
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #0B192C; /* 預設深藍色襯底，避免手機 RWD 閃爍 */
            color: #1E3E62;
            -webkit-tap-highlight-color: transparent;
        }
        
        .font-title {
            font-family: 'Cinzel', 'Noto Sans TC', serif;
        }

        /* 暮光奢華質感精緻陰影 */
        .shadow-luxury { 
            box-shadow: 0 12px 30px -8px rgba(11, 25, 44, 0.08), 0 4px 12px -3px rgba(11, 25, 44, 0.03); 
            border: 1px solid rgba(212, 173, 104, 0.15);
        }
        
        .shadow-luxury-sm { 
            box-shadow: 0 6px 15px -4px rgba(11, 25, 44, 0.05); 
            border: 1px solid rgba(212, 173, 104, 0.1); 
        }
        
        /* 隱藏滾動條 */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .safe-bottom { padding-bottom: calc(env(safe-area-inset-bottom) + 0.5rem); }
        
        /* 深度轉場動畫 */
        .fade-enter-active, .fade-leave-active { transition: opacity 0.25s ease, transform 0.25s ease; }
        .fade-enter-from, .fade-leave-to { opacity: 0; transform: translateY(4px); }

        /* 地圖固定容器比例 */
        #itinerary-map {
            height: 280px;
            width: 100%;
            z-index: 10;
            border-radius: 14px;
        }

        /* 👑 專屬長輩特大字體模式 class */
        .senior-mode .text-[9px] { font-size: 13px !important; line-height: 1.4 !important; }
        .senior-mode .text-[10px], .senior-mode .text-xs { font-size: 15px !important; line-height: 1.5 !important; }
        .senior-mode .text-sm { font-size: 17px !important; line-height: 1.6 !important; }
        .senior-mode .text-base { font-size: 19px !important; line-height: 1.6 !important; }
        .senior-mode .text-lg, .senior-mode h3 { font-size: 21px !important; line-height: 1.4 !important; font-weight: 800 !important; }
        .senior-mode .text-xl, .senior-mode h2 { font-size: 24px !important; line-height: 1.4 !important; font-weight: 900 !important; }
        .senior-mode .p-4 { padding: 1.25rem !important; }
        .senior-mode select, .senior-mode input, .senior-mode textarea { font-size: 16px !important; }
    </style>
</head>
<body class="antialiased flex justify-center min-h-screen pb-24 bg-twilightBg">

    <div id="app" :class="{'senior-mode': isSeniorFont}" class="w-full max-w-md bg-twilightPaper min-h-screen relative flex flex-col shadow-2xl">
        
        <!-- 系統初次載入保護機制 -->
        <div v-if="!isMounted" class="bg-twilightBg p-12 text-center my-auto flex flex-col items-center justify-center space-y-6 min-h-screen w-full">
            <div class="animate-spin text-twilightSand text-5xl"><i class="fa-solid fa-compass"></i></div>
            <p class="text-xl font-bold font-title tracking-widest text-twilightPaper">GOLDEN VOYAGE</p>
            <p class="text-[13px] text-twilightSand font-medium tracking-wide">一路同行，一路珍藏</p>
            <p class="text-xs text-twilightSand/80 leading-relaxed font-light">
                正為您部署全新「暮光海藍 x 溫潤沙金」<br>金廈深度航行手冊...
            </p>
        </div>

        <!-- Vue 正式框架 -->
        <template v-if="isMounted">
            
            <div class="p-4 bg-twilightBg text-white relative">
                <div class="relative w-full h-[180px] rounded-[18px] overflow-hidden group border border-twilightSand/20 shadow-lg">
                    <img :src="bannerImg" alt="金廈旅圖" class="w-full h-full object-cover transition-transform duration-700 hover:scale-105">
                    
                    <!-- 浮動編輯照片按鈕 -->
                    <button @click="triggerBannerEdit" class="absolute top-3 right-3 bg-black/50 hover:bg-black/80 backdrop-blur-md text-twilightSand text-[10px] px-3 py-1.5 rounded-full shadow-md transition-all font-bold flex items-center space-x-1.5 border border-twilightSand/30">
                        <i class="fa-solid fa-camera"></i>
                        <span>編輯封面</span>
                    </button>

                    <!-- 沉浸式漸層文案 -->
                    <div class="absolute inset-0 bg-gradient-to-t from-twilightBg via-black/10 to-transparent p-4 flex flex-col justify-end">
                        <p class="text-[9px] font-bold tracking-widest text-twilightSand uppercase">COASTAL DISCOVERY BOOK</p>
                        <h2 class="text-xl font-black mt-0.5 tracking-wide font-title text-white">{{ bannerTitle }}</h2>
                        <p class="text-[10px] text-twilightPaper/80 mt-1 font-light tracking-wider">{{ bannerSub }}</p>
                    </div>
                </div>

                <!-- 🌟 專屬長輩字體放大控制面板與頂部公告 -->
                <div class="mt-3 flex flex-col space-y-2">
                    <!-- 字體放大控制鈕 -->
                    <div class="flex justify-between items-center bg-twilightSlate/40 p-2 rounded-[12px] border border-twilightSand/15">
                        <span class="text-[11px] text-twilightPaper font-bold flex items-center space-x-1.5">
                            <i class="fa-solid fa-magnifying-glass-plus text-twilightSand"></i>
                            <span>長輩閱讀模式：</span>
                        </span>
                        <div class="flex space-x-1">
                            <button @click="isSeniorFont = false" :class="!isSeniorFont ? 'bg-twilightSand text-twilightBg' : 'bg-twilightSlate text-twilightPaper/60'" class="px-3 py-1 rounded-lg text-[10px] font-black transition-all">
                                標準字 ⚖️
                            </button>
                            <button @click="isSeniorFont = true" :class="isSeniorFont ? 'bg-red-500 text-white animate-pulse' : 'bg-twilightSlate text-twilightPaper/60'" class="px-3 py-1 rounded-lg text-[10px] font-black transition-all">
                                放大字 🔎
                            </button>
                        </div>
                    </div>

                    <!-- 廈門回憶製造所-->
                    <div class="flex justify-between items-center bg-twilightSlate/60 p-2.5 rounded-[12px] border border-twilightSand/15 text-[10px] text-twilightPaper font-medium">
                        <div class="flex items-center space-x-2">
                            <span class="w-2 h-2 bg-twilightSand rounded-full animate-ping"></span>
                            <span class="opacity-80">廈門回憶製造所</span>
                            <span class="font-bold text-twilightSand">{{ travelers.join('、') }}</span>
                        </div>
                        <span class="text-[9px] bg-twilightSand/20 text-twilightSand border border-twilightSand/30 px-2.5 py-0.5 rounded-full font-bold">行程準備就緒 🚢</span>
                    </div>
                </div>
            </div>

            <div class="p-4 flex-1 pb-16">

                <!-- ==================== TAB 1: 行程計畫 (PLAN) ==================== -->
                <div v-if="currentTab === 'plan'" class="space-y-4">
                    
                    <!-- 輕奢風橫向滑動日期切換 -->
                    <div class="flex space-x-2 overflow-x-auto pb-1.5 no-scrollbar">
                        <button v-for="(d, idx) in dates" :key="idx" @click="activeDateIdx = idx"
                                :class="activeDateIdx === idx ? 'bg-twilightBg text-twilightSand shadow-md border-twilightSand' : 'bg-white text-twilightMuted border-transparent'"
                                class="flex flex-col items-center justify-center min-w-[70px] h-[78px] rounded-[16px] shadow-luxury-sm transition-all shrink-0 border-2">
                            <span class="text-[9px] font-bold tracking-widest uppercase" :class="activeDateIdx === idx ? 'text-twilightSand' : 'text-twilightMuted'">{{ d.week }}</span>
                            <span class="text-base font-black mt-1 tracking-tight">{{ d.day }}</span>
                        </button>
                    </div>

                    <!-- ⛅ 每日動態天氣與船班交通監控狀況 -->
                    <div class="bg-white p-3.5 rounded-[16px] border border-twilightSand/25 shadow-luxury-sm space-y-2.5">
                        <div class="flex justify-between items-center border-b border-stone-100 pb-1.5">
                            <span class="text-xs font-bold text-twilightBg flex items-center space-x-1.5">
                                <i class="fa-solid fa-cloud-sun text-twilightSand animate-pulse"></i>
                                <span>今日天氣與環境狀態</span>
                            </span>
                            <span class="text-[11px] font-mono font-black text-twilightSand bg-twilightBg px-2 py-0.5 rounded">{{ activeDateWeather.temp }}</span>
                        </div>
                        <p class="text-[11px] text-twilightMuted leading-relaxed">
                            🌤️ {{ activeDateWeather.desc }}
                        </p>
                        <div class="border-t border-dashed border-stone-200/60 pt-2 flex flex-col space-y-1">
                            <span class="text-[10px] font-bold text-twilightSlate flex items-center space-x-1.5">
                                <i class="fa-solid fa-ship text-sky-500"></i>
                                <span>今日船班 / 大眾運輸狀態監控</span>
                            </span>
                            <p class="text-[11px] text-twilightMuted leading-relaxed font-light">
                                {{ activeDateWeather.transitStatus }}
                            </p>
                        </div>
                    </div>

                    <!-- 每日住宿特惠提示 -->
                    <div class="bg-white p-3.5 rounded-[16px] border border-twilightSand/20 shadow-luxury-sm flex justify-between items-start text-xs">
                        <div class="space-y-1">
                            <span class="font-bold text-twilightBg flex items-center space-x-1.5">
                                <i class="fa-solid fa-hotel text-twilightSand"></i>
                                <span class="font-bold">落腳旅店：宜度・潮宿家庭房 (中山路步行街)</span>
                            </span>
                            <p class="text-twilightMuted leading-relaxed text-[11px] font-light">
                                🍳 旅宿提供免費特惠家庭早餐 2 份（07:00-10:00）<br>
                                💡 <span class="text-twilightSand font-medium">貼心提醒：</span>Day 2 與 Day 3 使用此早餐最劃算！
                            </p>
                        </div>
                    </div>

                    <!-- 行程篩選器 -->
                    <div class="flex items-center space-x-2 bg-white p-3 rounded-[16px] shadow-luxury-sm border border-twilightSand/10">
                        <span class="text-[10px] font-bold text-twilightMuted uppercase tracking-wider shrink-0">分類篩選：</span>
                        <select v-model="filterCategory" class="w-full bg-transparent text-xs font-bold text-twilightBg outline-none cursor-pointer">
                            <option value="全部">全部探索項目</option>
                            <option v-for="cat in categories" :key="cat" :value="cat">{{ cat }}</option>
                        </select>
                    </div>

                    <!-- 行程列表 -->
                    <div class="space-y-4">
                        <div v-for="(item, idx) in filteredSchedule" :key="item.id" class="relative">
                            
                            <!-- 交通轉場引導 -->
                            <div v-if="idx > 0" class="flex justify-center items-center py-2 text-[10px] font-bold text-twilightMuted space-x-2">
                                <span class="w-8 h-[1px] bg-twilightSand/20"></span>
                                <span>{{ item.transitIcon || '🚗' }} 下一個目的地移動約 {{ item.transitTime || '15' }} 分鐘</span>
                                <span class="w-8 h-[1px] bg-twilightSand/20"></span>
                            </div>

                            <!-- 精裝手帳卡片 -->
                            <div class="bg-white rounded-luxury shadow-luxury overflow-hidden flex flex-col relative group">
                                <div v-if="item.image" class="w-full h-44 relative bg-stone-100 overflow-hidden">
                                    <img :src="item.image" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105" alt="景點照" onerror="this.src='https://placehold.co/600x400/0b192c/ffffff?text=Voyage'">
                                    <span class="absolute top-3 left-3 bg-twilightBg/90 backdrop-blur-md text-twilightSand text-[9px] font-bold tracking-widest px-2.5 py-1 rounded-full uppercase border border-twilightSand/30">
                                        {{ item.category }}
                                    </span>
                                </div>

                                <div class="p-4 space-y-3">
                                    <div class="flex justify-between items-center">
                                        <div class="flex items-center space-x-2">
                                            <span class="text-xs font-mono font-bold px-2.5 py-1 rounded-md bg-twilightBg text-twilightSand">
                                                {{ item.time }}
                                            </span>
                                            <span v-if="isKeyTime(item.time, item.dateIdx)" class="text-[9px] text-red-500 font-bold bg-red-50 border border-red-200 px-1.5 py-0.5 rounded animate-pulse">重要出發時段！</span>
                                        </div>
                                        <div class="flex items-center space-x-1 text-xs text-twilightMuted">
                                            <button @click="moveItem(idx, -1)" class="p-1 hover:text-twilightBg transition" title="往上移">▲</button>
                                            <button @click="moveItem(idx, 1)" class="p-1 hover:text-twilightBg transition" title="往下移">▼</button>
                                        </div>
                                    </div>
                                    
                                    <h3 class="text-base font-bold text-twilightBg tracking-wide leading-tight">{{ item.title }}</h3>
                                    
                                    <div class="text-[11px] text-twilightMuted space-y-1 bg-twilightPaper p-3 rounded-lg border border-twilightSand/10 leading-relaxed font-light">
                                        <p v-if="item.ticket" class="font-medium text-twilightSlate">🎟️ 門票規章：{{ item.ticket }}</p>
                                        <p>{{ item.notes }}</p>
                                    </div>

                                    <div class="pt-3 border-t border-dashed border-stone-100 flex justify-between items-center">
                                        <button @click="openGoogleMap(item.title)" class="text-[10px] bg-twilightBg text-twilightSand font-bold px-3.5 py-2 rounded-lg hover:bg-twilightSlate transition flex items-center space-x-1.5 border border-twilightSand/20">
                                            <i class="fa-solid fa-location-dot"></i><span>開啟 Google Maps</span>
                                        </button>
                                        <button @click="openEditModal(item)" class="text-[10px] text-twilightSand hover:text-twilightBg font-bold">編輯行程與照片</button>
                                    </div>
                                </div>
                            </div>

                        </div>
                    </div>

                    <!-- 新增行程按鈕 -->
                    <button @click="openAddModal" class="fixed bottom-24 right-6 z-30 bg-twilightBg text-twilightSand p-4 rounded-full shadow-luxury hover:scale-105 active:scale-95 transition-all border border-twilightSand/40">
                        <i class="fa-solid fa-plus text-base"></i>
                    </button>
                </div>

                <!-- ==================== TAB 2: 深度導覽與行程地圖 (GUIDE) ==================== -->
                <div v-if="currentTab === 'guide'" class="space-y-4">
                    
                    <div class="bg-white p-4 rounded-luxury shadow-luxury space-y-3">
                        <h3 class="text-xs font-bold text-twilightBg flex items-center justify-between border-b border-stone-100 pb-2">
                            <span class="flex items-center space-x-1.5">
                                <i class="fa-solid fa-map-location-dot text-twilightSand"></i>
                                <span>金門 x 廈門 尊榮航行軌跡圖</span>
                            </span>
                            <span class="text-[9px] bg-twilightSand/10 text-twilightSand px-2 py-0.5 rounded border border-twilightSand/20 font-bold">動態地圖</span>
                        </h3>
                        
                        <div class="relative rounded-lg overflow-hidden border border-twilightSand/20 shadow-inner">
                            <div id="itinerary-map"></div>
                        </div>

                        <!-- 快捷跳轉地標 -->
                        <div class="space-y-1.5">
                            <p class="text-[9px] text-twilightMuted font-bold uppercase tracking-wider">點擊快速定位景點標記：</p>
                            <div class="flex flex-wrap gap-1.5">
                                <button v-for="pt in mapPoints" :key="pt.name" @click="focusMapPoint(pt)" class="text-[9px] bg-twilightBg hover:bg-twilightSlate text-twilightSand font-semibold px-2 py-1 rounded border border-twilightSand/25 transition">
                                    📍 {{ pt.name }}
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- 精裝雜誌排版風格導覽 -->
                    <div class="bg-white p-5 rounded-luxury shadow-luxury space-y-5">
                        <div class="text-center pb-4 border-b border-twilightSand/20">
                            <p class="text-[9px] font-bold tracking-widest text-twilightSand uppercase">CULTURAL GEOGRAPHY</p>
                            <h2 class="text-base font-black font-title text-twilightBg mt-1">金廈地理誌與人文特考</h2>
                            <div class="w-10 h-[2px] bg-twilightSand/60 mx-auto mt-2.5"></div>
                        </div>

                        <!-- 景點介紹 1 -->
                        <div class="space-y-2">
                            <div class="flex items-center space-x-2">
                                <span class="text-[9px] bg-twilightSand/15 text-twilightSand border border-twilightSand/20 px-2 py-0.5 rounded font-bold">歷史建築</span>
                                <h3 class="text-xs font-bold text-twilightBg">🗺️ 鼓浪嶼：鋼琴之島與萬國博覽會</h3>
                            </div>
                            <p class="text-[11px] text-twilightMuted leading-relaxed font-light">
                                鼓浪嶼因漲潮時浪擊礁石，聲如擂鼓而得名。清末時期多國在此設立領事館，因而保留了豐富的西方古典建築。
                                <span class="block mt-1 italic text-twilightSand">💡 漫遊冷知識：全島禁止機動車行駛，是最天然的步行博物館。</span>
                            </p>
                        </div>

                        <!-- 景點介紹 2 -->
                        <div class="space-y-2 border-t border-dashed border-stone-100 pt-4">
                            <div class="flex items-center space-x-2">
                                <span class="text-[9px] bg-rose-50 text-red-500 border border-red-200 px-2 py-0.5 rounded font-bold">世界遺產</span>
                                <h3 class="text-xs font-bold text-twilightBg">🧱 南靖土樓：建在沼澤上的奇蹟</h3>
                            </div>
                            <p class="text-[11px] text-twilightMuted leading-relaxed font-light">
                                和貴樓是南靖土樓中最高的一座，最驚人的是它建在鬆軟的沼澤地上，依靠 200 多根松木打樁、互相支撐，歷經數百年風雨屹立不倒。
                            </p>
                        </div>

                        <!-- 景點介紹 3 -->
                        <div class="space-y-2 border-t border-dashed border-stone-100 pt-4">
                            <div class="flex items-center space-x-2">
                                <span class="text-[9px] bg-twilightSlate/10 text-twilightSlate border border-twilightSlate/20 px-2 py-0.5 rounded font-bold">現代景緻</span>
                                <h3 class="text-xs font-bold text-twilightBg">🚇 跨海列車：神隱少女的波光剪影</h3>
                            </div>
                            <p class="text-[11px] text-twilightMuted leading-relaxed font-light">
                                廈門地鐵 1 號線的「集美學村 - 高崎」段，當列車緩緩駛出地下隧道，車窗外瞬間展開一望無際的蔚藍大海。傍晚 17:30 左右搭乘，夕陽灑在波光粼粼的海面上，極具電影般的浪漫美感。
                            </p>
                        </div>
                    </div>
                </div>

                <!-- ==================== TAB 3: 記帳與公費 (WALLET) ==================== -->
                <div v-if="currentTab === 'wallet'" class="space-y-4">
                    
                    <div class="bg-twilightBg text-white p-5 rounded-luxury shadow-luxury space-y-4 relative overflow-hidden border border-twilightSand/30">
                        <div class="flex justify-between items-center">
                            <span class="text-[9px] tracking-widest uppercase font-bold text-twilightSand">PUBLIC BUDGET 旅伴公費金庫</span>
                            <button @click="openPublicFundModal" class="text-[10px] text-twilightSand hover:underline">重新設定公費</button>
                        </div>
                        <div class="grid grid-cols-2 gap-4 border-t border-twilightSand/10 pt-3">
                            <div>
                                <p class="text-[10px] text-twilightMuted uppercase font-semibold">初始公費預算</p>
                                <p class="text-sm font-bold font-mono text-white">¥ {{ initialPublicFund }}</p>
                            </div>
                            <div>
                                <p class="text-[10px] text-twilightMuted uppercase font-semibold">剩餘公費餘額</p>
                                <p class="text-xl font-bold font-mono text-twilightSand">¥ {{ remainingPublicFund }}</p>
                            </div>
                        </div>
                        <p class="text-[9px] text-twilightMuted italic pt-1 border-t border-dashed border-twilightSand/10">
                            ※ 公費餘額會由下方勾選了「公費直接支付」的開銷項目中自動即時扣抵計算。
                        </p>
                    </div>

                    <!-- 算式換算計算機 -->
                    <div class="bg-white p-4 rounded-luxury shadow-luxury space-y-3">
                        <div class="flex justify-between items-center border-b border-stone-100 pb-2">
                            <h4 class="text-xs font-bold text-twilightBg">💱 算式匯率即時換算工具</h4>
                            <div class="flex items-center space-x-1 text-xs">
                                <span class="text-twilightMuted font-mono text-[11px]">1 RMB ≈ </span>

                                    width = MAX_WIDTH;
                                }
                            } else {
                                if (height > MAX_HEIGHT) {
                                    width *= MAX_HEIGHT / height;
                                    height = MAX_HEIGHT;
                                }
                            }

                            canvas.width = width;
                            canvas.height = height;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, width, height);

                            tempCompressedImg.value = canvas.toDataURL('image/jpeg', 0.6);
                            showToast('照片壓縮讀取成功！');
                        };
                        img.src = event.target.result;
                    };
                    reader.readAsDataURL(file);
                };

                // 憑證夾專用照片壓縮
                const onDocPhotoUploaded = (e) => {
                    const file = e.target.files[0];
                    if (!file) return;

                    const reader = new FileReader();
                    reader.onload = (event) => {
                        const img = new Image();
                        img.onload = () => {
                            const canvas = document.createElement('canvas');
                            const MAX_WIDTH = 500; // 憑證保留高解析一點點
                            const MAX_HEIGHT = 500;
                            let width = img.width;
                            let height = img.height;

                            if (width > height) {
                                if (width > MAX_WIDTH) {
                                    height *= MAX_WIDTH / width;
                                    width = MAX_WIDTH;
                                }
                            } else {
                                if (height > MAX_HEIGHT) {
                                    width *= MAX_HEIGHT / height;
                                    height = MAX_HEIGHT;
                                }
                            }

                            canvas.width = width;
                            canvas.height = height;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, width, height);

                            tempDocImg.value = canvas.toDataURL('image/jpeg', 0.6);
                            showToast('憑證影像讀取完成！');
                        };
                        img.src = event.target.result;
                    };
                    reader.readAsDataURL(file);
                };

                const saveDoc = () => {
                    if (!newDoc.value.title.trim() || !tempDocImg.value) {
                        showToast('請填寫憑證說明並拍照上傳！');
                        return;
                    }
                    vaultDocs.value.unshift({
                        id: Date.now(),
                        title: newDoc.value.title,
                        image: tempDocImg.value
                    });
                    newDoc.value.title = '';
                    tempDocImg.value = '';
                    showToast('重要憑證儲存成功！');
                };

                const deleteDoc = (id) => {
                    vaultDocs.value = vaultDocs.value.filter(d => d.id !== id);
                    showToast('憑證檔案已安全移出。');
                };

                // 檢視放大
                const viewFullPhoto = (base64Url) => {
                    photoViewerUrl.value = base64Url;
                };

                // 行程資料管理
                const openAddModal = () => {
                    isEditing.value = false;
                    formItem.value = { id: '', dateIdx: activeDateIdx.value, time: '12:00', title: '', category: '景點', notes: '', ticket: '', image: '', transitIcon: '🚗', transitTime: 15 };
                    showModal.value = true;
                };

                const openEditModal = (item) => {
                    isEditing.value = true;
                    formItem.value = { ...item };
                    showModal.value = true;
                };

                const saveItem = () => {
                    if (!formItem.value.title.trim()) {
                        showToast('項目名稱不能為空！');
                        return;
                    }
                    if (isEditing.value) {
                        const index = scheduleItems.value.findIndex(i => i.id === formItem.value.id);
                        if (index !== -1) scheduleItems.value[index] = { ...formItem.value };
                        showToast('行程內容更新成功！');
                    } else {
                        formItem.value.id = 'custom_' + Date.now();
                        scheduleItems.value.push({ ...formItem.value });
                        showToast('自訂行程建立成功！');
                    }
                    showModal.value = false;
                };

                const confirmDeleteItem = () => {
                    showConfirmModal.value = true;
                };

                const executeDeleteItem = () => {
                    scheduleItems.value = scheduleItems.value.filter(i => i.id !== formItem.value.id);
                    showConfirmModal.value = false;
                    showModal.value = false;
                    showToast('行程已移出規劃書。');
                };

                const moveItem = (index, direction) => {
                    const currentList = [...filteredSchedule.value];
                    const targetIndex = index + direction;
                    if (targetIndex < 0 || targetIndex >= currentList.length) return;

                    const id1 = currentList[index].id;
                    const id2 = currentList[targetIndex].id;

                    const realIdx1 = scheduleItems.value.findIndex(i => i.id === id1);
                    const realIdx2 = scheduleItems.value.findIndex(i => i.id === id2);

                    const temp = scheduleItems.value[realIdx1];
                    scheduleItems.value[realIdx1] = scheduleItems.value[realIdx2];
                    scheduleItems.value[realIdx2] = temp;
                };

                // 記帳與公費
                const addExpense = () => {
                    if (!newExpense.value.amount || !newExpense.value.title.trim()) {
                        showToast('請填寫金額與開支品項！');
                        return;
                    }
                    expenses.value.unshift({
                        id: Date.now(),
                        title: newExpense.value.title,
                        category: newExpense.value.category,
                        amount: newExpense.value.amount,
                        payer: newExpense.value.payer,
                        splitWith: [...newExpense.value.splitWith],
                        isPublic: newExpense.value.isPublic,
                        image: tempCompressedImg.value
                    });

                    // 表單初始化
                    newExpense.value = {
                        amount: null,
                        title: '',
                        category: '美食',
                        payer: '姿綾',
                        splitWith: ['姿綾', '琬棋', '媽媽', '小阿姨'],
                        isPublic: false
                    };
                    tempCompressedImg.value = '';
                    showToast('探索開銷儲存成功！');
                };

                const deleteExpense = (id) => {
                    expenses.value = expenses.value.filter(e => e.id !== id);
                    showToast('開支已刪除。');
                };

                const openGoogleMap = (query) => {
                    window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(query)}`, '_blank');
                };

                const getExpenseIcon = (cat) => {
                    switch(cat) {
                        case '交通': return '🚗';
                        case '美食': return '🍱';
                        case '住宿': return '🏨';
                        case '門票': return '🎟️';
                        case '購物': return '🛍️';
                        default: return '💰';
                    }
                };

                return {
                    isMounted, currentTab, activeDateIdx, filterCategory, exchangeRate, initialPublicFund, remainingPublicFund,
                    dates, categories, travelers, todos, souvenirs, expenses, newExpense, calcExpression, calcValue, tempCompressedImg, photoViewerUrl,
                    filteredSchedule, showModal, isEditing, formItem, personalMemo, parsedLinks, mapPoints, vaultDocs, newDoc, tempDocImg,
                    showBannerModal, bannerTitle, bannerSub, bannerImg, tempBannerTitle, tempBannerSub, tempBannerImg,
                    showPublicFundModal, tempPublicFund, toastMessage, showConfirmModal, activeDateWeather,
                    isSeniorFont, // 🌟 長輩字體放大狀態
                    triggerBannerEdit, saveBannerSettings, openPublicFundModal, savePublicFund, calcResult, evalCalc, onPhotoUploaded, viewFullPhoto,
                    openAddModal, openEditModal, saveItem, confirmDeleteItem, executeDeleteItem, moveItem, addExpense, deleteExpense, openGoogleMap, getExpenseIcon, isKeyTime,
                    focusMapPoint, onDocPhotoUploaded, saveDoc, deleteDoc
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
