                                <button onClick={() => { setCurrentTab('vault'); window.scrollTo({ top: 0, behavior: 'smooth' }); }} className={`flex flex-col items-center justify-center transition-all ${currentTab === 'vault' ? 'text-[#4A5D4E] scale-105 font-black' : 'text-[#8FA89B]'}`}>
                                    <i className="fa-solid fa-passport text-xl mb-1 text-[#4A5D4E]"></i><span className="text-[11px] tracking-wider font-bold">憑證夾</span>
                                </button>
                                <button onClick={() => { setCurrentTab('memo'); window.scrollTo({ top: 0, behavior: 'smooth' }); }} className={`flex flex-col items-center justify-center transition-all ${currentTab === 'memo' ? 'text-[#4A5D4E] scale-105 font-black' : 'text-[#8FA89B]'}`}>
                                    <i className="fa-solid fa-clipboard-list text-xl mb-1 text-[#4A5D4E]"></i><span className="text-[11px] tracking-wider font-bold">備忘清單</span>
                                </button>
                                <button onClick={() => { setCurrentTab('souvenir'); window.scrollTo({ top: 0, behavior: 'smooth' }); }} className={`flex flex-col items-center justify-center transition-all ${currentTab === 'souvenir' ? 'text-[#4A5D4E] scale-105 font-black' : 'text-[#8FA89B]'}`}>
                                    <i className="fa-solid fa-gift text-xl mb-1 text-[#4A5D4E]"></i><span className="text-[11px] tracking-wider font-bold">伴手禮</span>
                                </button>
                            </div>
                        )}

                        {showSettingsModal && (
                            <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
                                <div className="bg-[#FDFCF7] w-full max-w-sm rounded-3xl p-6 space-y-4 shadow-2xl border-2 border-[#C59B6D]">
                                    <div className="flex justify-between items-center border-b border-[#EDE7D9] pb-2">
                                        <h4 className="text-base font-black text-[#2B3E2D] flex items-center space-x-2">
                                            <i className="fa-solid fa-sliders text-[#C59B6D]"></i><span>手帳後台與資料備份</span>
                                        </h4>
                                        <button onClick={() => setShowSettingsModal(false)} className="text-[#8FA89B] font-bold text-base">✕</button>
                                    </div>
                                    <div className="space-y-3.5 text-xs text-[#2B3E2D] font-bold">
                                        <div className="bg-amber-50 p-4 rounded-2xl border border-amber-300 space-y-2">
                                            <span className="text-amber-800 font-black block text-sm text-center">🔄 手帳數據備份與還原庫</span>
                                            <div className="grid grid-cols-2 gap-2 pt-1.5">
                                                <button onClick={() => { exportAllData(); setShowSettingsModal(false); }} className="bg-[#4A5D4E] text-[#C59B6D] py-2.5 px-2 rounded-xl font-bold hover:bg-[#2B3E2D] transition shadow">
                                                    <i className="fa-solid fa-copy mr-1"></i>複製備份碼
                                                </button>
                                                <button onClick={() => { importAllData(); setShowSettingsModal(false); }} className="bg-[#C59B6D] text-[#2B3E2D] py-2.5 px-2 rounded-xl font-bold hover:bg-amber-300 transition shadow">
                                                    <i className="fa-solid fa-file-import mr-1"></i>導入備份碼
                                                </button>
                                            </div>
                                            <button onClick={() => { if (confirm("準備航行將會重設並清空本機手記快取，確定重新啟航嗎？")) { localStorage.clear(); window.location.reload(); } }} className="mt-3 w-full bg-red-600 hover:bg-red-700 text-white font-black py-2.5 rounded-xl shadow transition text-[11px]">🚀 強制重置 ‧ 準備航行</button>
                                        </div>
                                    </div>
                                    <div className="pt-2">
                                        <button onClick={() => setShowSettingsModal(false)} className="w-full bg-[#4A5D4E] text-[#C59B6D] py-2.5 rounded-xl font-bold border border-[#C59B6D]/30">關閉設定面板</button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {showItemModal && (
                            <div className="fixed inset-0 bg-black/60 z-50 flex items-end justify-center backdrop-blur-sm">
                                <div className="bg-white w-full max-w-md rounded-t-3xl p-6 space-y-4 max-h-[85vh] overflow-y-auto shadow-2xl border-t-4 border-[#C59B6D]">
                                    <div className="flex justify-between items-center border-b border-[#EDE7D9] pb-3">
                                        <h3 className="text-base font-black text-[#2B3E2D]">{isEditingItem ? '🖋️ 編輯行程手記' : '➕ 新增漫遊行程'}</h3>
                                        <button onClick={() => setShowItemModal(false)} className="text-[#8FA89B] font-black text-lg">✕</button>
                                    </div>
                                    <div className="space-y-4 text-xs font-bold text-[#2B3E2D]">
                                        <div>
                                            <label className="block text-[#8FA89B] mb-1">景點類別</label>
                                            <select value={itemForm.category} onChange={(e) => setItemForm(prev => ({ ...prev, category: e.target.value }))} className="w-full bg-[#FDFCF7] border border-[#E3DEC3] rounded-xl p-3 text-[16px]">
                                                {['景點', '住宿', '美食', '購物', '航班', '交通'].map(c => (<option key={c} value={c}>{c}</option>))}
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-[#8FA89B] mb-1">行程景點標題</label>
                                            <input type="text" value={itemForm.title} onChange={(e) => setItemForm(prev => ({ ...prev, title: e.target.value }))} placeholder="例如：南普陀寺祈福" className="w-full bg-[#FDFCF7] border border-[#E3DEC3] rounded-xl p-3 text-[16px]" />
                                        </div>
                                        <div className="grid grid-cols-2 gap-3">
                                            <div>
                                                <label className="block text-[#8FA89B] mb-1">時段 (例如 14:00)</label>
                                                <input type="text" value={itemForm.time} onChange={(e) => setItemForm(prev => ({ ...prev, time: e.target.value }))} className="w-full bg-[#FDFCF7] border border-[#E3DEC3] rounded-xl p-3 font-mono text-[16px]" />
                                            </div>
                                            <div>
                                                <label className="block text-[#8FA89B] mb-1">預訂門票/備註</label>
                                                <input type="text" value={itemForm.ticket} onChange={(e) => setItemForm(prev => ({ ...prev, ticket: e.target.value }))} placeholder="無則免填" className="w-full bg-[#FDFCF7] border border-[#E3DEC3] rounded-xl p-3 text-[16px]" />
                                            </div>
                                        </div>
                                        <div>
                                            <label className="block text-[#8FA89B] mb-1">配圖網址</label>
                                            <input type="text" value={itemForm.image} onChange={(e) => setItemForm(prev => ({ ...prev, image: e.target.value }))} placeholder="請貼上 Unsplash 圖片連結" className="w-full bg-[#FDFCF7] border border-[#E3DEC3] rounded-xl p-3 text-[16px]" />
                                        </div>
                                        <div>
                                            <label className="block text-[#8FA89B] mb-1">深度導覽備註</label>
                                            <textarea value={itemForm.notes} onChange={(e) => setItemForm(prev => ({ ...prev, notes: e.target.value }))} rows={2} className="w-full bg-[#FDFCF7] border border-[#E3DEC3] rounded-xl p-3 text-[16px]" />
                                        </div>
                                    </div>
                                    <div className="pt-2 flex space-x-3 text-sm">
                                        {isEditingItem && <button onClick={() => deleteScheduleItem(itemForm.id)} className="flex-1 bg-red-50 hover:bg-red-100 text-red-500 border border-red-200 rounded-xl py-3 font-black">刪除景點</button>}
                                        <button onClick={saveScheduleItem} className="flex-[2] bg-[#4A5D4E] hover:bg-[#2B3E2D] text-[#C59B6D] rounded-xl py-3 font-black text-base">儲存行程手札</button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {showSouvenirModal && (
                            <div className="fixed inset-0 bg-black/60 z-50 flex items-end justify-center backdrop-blur-sm">
                                <div className="bg-white w-full max-w-md rounded-t-3xl p-6 space-y-4 max-h-[85vh] overflow-y-auto shadow-2xl border-t-4 border-[#C59B6D]">
                                    <div className="flex justify-between items-center border-b border-[#EDE7D9] pb-3">
                                        <h3 className="text-base font-black text-[#2B3E2D]">🛍️ 編輯採買店家</h3>
                                        <button onClick={() => setShowSouvenirModal(false)} className="text-[#8FA89B] font-black text-lg">✕</button>
                                    </div>
                                    <div className="space-y-4 text-xs font-bold text-[#2B3E2D]">
                                        <div>
                                            <label className="block text-[#8FA89B] mb-1">採購商家名稱 / 地點</label>
                                            <input type="text" value={souvenirForm.location} onChange={(e) => setSouvenirForm(prev => ({ ...prev, location: e.target.value }))} placeholder="例如：中山路阿吉仔" className="w-full bg-[#FDFCF7] border border-[#E3DEC3] rounded-xl p-3 text-[16px]" />
                                        </div>
                                        <div className="bg-[#FDFCF7] p-3.5 rounded-2xl border border-[#EDE7D9] space-y-3">
                                            <label className="block text-[#8FA89B]">新增該店欲採購細項：</label>
                                            <div className="space-y-2">
                                                {souvenirForm.items.map((sub, sIdx) => (
                                                    <div key={sIdx} className="flex justify-between items-center bg-white p-2 rounded-lg border border-[#E3DEC3] text-xs">
                                                        <span>{sub.name}</span>
                                                        <button onClick={() => { setSouvenirForm(prev => ({ ...prev, items: prev.items.filter((_, idx) => idx !== sIdx) })); }} className="text-red-500 font-black px-2">移除</button>
                                                    </div>
                                                ))}
                                            </div>
                                            <div className="flex space-x-2">
                                                <input type="text" value={newSubItem} onChange={(e) => setNewSubItem(e.target.value)} placeholder="如：手工原味貢糖" className="flex-1 bg-white border border-[#E3DEC3] rounded-xl p-2.5 text-xs text-[16px]" />
                                                <button onClick={addSubItemToSouvenir} className="bg-[#4A5D4E] text-[#C59B6D] px-3.5 rounded-xl font-black text-xs">新增</button>
                                            </div>
                                        </div>
                                    </div>
                                    <div className="pt-2">
                                        <button onClick={saveSouvenirShop} className="w-full bg-[#4A5D4E] hover:bg-[#2B3E2D] text-[#C59B6D] py-3.5 rounded-xl font-black text-base">儲存伴手禮商店設定</button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {showBudgetModal && (
                            <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
                                <div className="bg-white w-full max-w-xs rounded-2xl p-5 space-y-4 shadow-2xl border border-[#C59B6D]">
                                    <h4 className="text-sm font-black text-[#2B3E2D] border-b border-[#EDE7D9] pb-2">設定公費小金庫儲備額</h4>
                                    <div className="space-y-3 text-xs font-bold text-[#2B3E2D]">
                                        <div>
                                            <label className="block text-[#8FA89B] mb-1">初始公費金額 (RMB)</label>
                                            <input type="number" value={tempBudget} onChange={(e) => setTempBudget(Number(e.target.value) || 0)} className="w-full bg-[#FDFCF7] border border-[#E3DEC3] rounded-xl p-3 font-mono font-black text-[16px]" />
                                        </div>
                                    </div>
                                    <div className="flex space-x-2 pt-1 text-xs">
                                        <button onClick={() => setShowBudgetModal(false)} className="flex-1 bg-[#EDE7D9] text-[#2B3E2D] py-2.5 rounded-xl font-bold text-sm">取消</button>
                                        <button onClick={() => { setInitialPublicFund(tempBudget); localStorage.setItem('xm_pub_fund', tempBudget.toString()); setShowBudgetModal(false); showToast("公費小金庫額度更新成功！"); }} className="flex-1 bg-[#4A5D4E] text-[#C59B6D] py-2.5 rounded-xl font-bold text-sm">確認變更</button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {showNewDocModal && (
                            <div className="fixed inset-0 bg-black/60 z-50 flex items-end justify-center backdrop-blur-sm">
                                <div className="bg-white w-full max-w-md rounded-t-3xl p-6 space-y-4 max-h-[85vh] overflow-y-auto shadow-2xl border-t-4 border-[#C59B6D]">
                                    <div className="flex justify-between items-center border-b border-[#EDE7D9] pb-3">
                                        <h3 className="text-base font-black text-[#2B3E2D]">🛡️ 上傳新重要憑證</h3>
                                        <button onClick={() => setShowNewDocModal(false)} className="text-[#8FA89B] font-black text-lg">✕</button>
                                    </div>
                                    <div className="space-y-4 text-xs font-bold text-[#2B3E2D]">
                                        <div>
                                            <label className="block text-[#8FA89B] mb-1">憑證說明標題</label>
                                            <input type="text" value={newDoc.title} onChange={(e) => setNewDoc(prev => ({ ...prev, title: e.target.value }))} placeholder="例如：立榮航空來回船票證明" className="w-full bg-[#FDFCF7] border border-[#E3DEC3] rounded-xl p-3 text-[16px]" />
                                        </div>
                                        <div>
                                            <label className="block text-[#8FA89B] mb-1">憑證詳細描述</label>
                                            <textarea value={newDoc.description} onChange={(e) => setNewDoc(prev => ({ ...prev, description: e.target.value }))} placeholder="填寫保單單號或認證細節..." rows={2} className="w-full bg-[#FDFCF7] border border-[#E3DEC3] rounded-xl p-3 text-[16px]" />
                                        </div>
                                        <div>
                                            <label className="block text-[#8FA89B] mb-1">選擇憑證影像或拍照</label>
                                            <label className="flex items-center justify-center bg-[#FDFCF7] border border-dashed border-[#E3DEC3] rounded-xl p-3 cursor-pointer hover:bg-[#EDE7D9]/20">
                                                <i className="fa-solid fa-camera text-[#C59B6D] mr-2"></i>
                                                <span>{newDoc.image ? '憑證相片讀取完成 📸' : '選擇手機拍照 / 上傳憑證'}</span>
                                                <input type="file" accept="image/*" onChange={(e) => handlePhotoUpload(e, (url) => setNewDoc(prev => ({ ...prev, image: url })))} className="hidden" />
                                            </label>
                                        </div>
                                    </div>
                                    <div className="pt-2">
                                        <button onClick={() => { if (!newDoc.title.trim()) { showToast("請輸入憑證說明標題"); return; } setVaultDocs(prev => [{ id: Date.now(), ...newDoc, isBroken: false }, ...prev]); setShowNewDocModal(false); showToast("成功登載新憑證文件"); }} className="w-full bg-[#4A5D4E] hover:bg-[#2B3E2D] text-[#C59B6D] py-3.5 rounded-xl font-black text-base">確認安全儲存憑證</button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {photoViewerUrl && (
                            <div className="fixed inset-0 bg-black/90 z-50 flex flex-col justify-center items-center p-4" onClick={() => setPhotoViewerUrl(null)}>
                                <img src={photoViewerUrl} className="max-w-full max-h-[80vh] rounded-2xl shadow-2xl object-contain" alt="收據" />
                                <button className="mt-4 bg-white text-[#2B3E2D] px-6 py-2.5 rounded-full font-black text-xs shadow-md">✕ 點擊任意處關閉放大圖</button>
                            </div>
                        )}

                        {toastMessage && (
                            <div className="fixed bottom-28 left-1/2 -translate-x-1/2 bg-[#4A5D4E] text-[#FDFCF7] border-2 border-[#C59B6D] px-5 py-3 rounded-2xl shadow-xl text-xs tracking-wider z-50 flex items-center space-x-2 animate-bounce">
                                <i className="fa-solid fa-feather text-[#C59B6D]"></i><span className="font-bold">{toastMessage}</span>
                            </div>
                        )}

                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
