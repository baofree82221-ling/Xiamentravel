<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>🧭 金門 x 廈門 尊榮深度探索手冊</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        twilightBg: '#0B192C',
                        twilightSlate: '#1E3E62',
                        twilightSand: '#D4AD68',
                        twilightPaper: '#FAF9F6',
                        twilightMuted: '#64748B',
                        twilightCard: '#FFFFFF'
                    },
                    borderRadius: {
                        'luxury': '20px'
                    }
                }
            }
        }
    </script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap');
        
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #0B192C;
            color: #1E3E62;
            -webkit-tap-highlight-color: transparent;
        }
        
        .font-title {
            font-family: 'Cinzel', 'Noto Sans TC', serif;
        }

        .shadow-luxury { 
            box-shadow: 0 12px 30px -8px rgba(11, 25, 44, 0.08), 0 4px 12px -3px rgba(11, 25, 44, 0.03); 
            border: 1px solid rgba(212, 173, 104, 0.15);
        }
        
        .shadow-luxury-sm { 
            box-shadow: 0 6px 15px -4px rgba(11, 25, 44, 0.05); 
            border: 1px solid rgba(212, 173, 104, 0.1); 
        }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .safe-bottom { padding-bottom: calc(env(safe-area-inset-bottom) + 0.5rem); }
        
        .fade-enter-active, .fade-leave-active { transition: opacity 0.25s ease, transform 0.25s ease; }
        .fade-enter-from, .fade-leave-to { opacity: 0; transform: translateY(4px); }

        #itinerary-map {
            height: 280px;
            width: 100%;
            z-index: 10;
            border-radius: 14px;
        }

        /* ✅ 【修復】全新長輩字體放大模式 - 使用全稱選擇器確保動態類別生效 */
        .senior-mode {
            font-size: 1.15rem !important;
        }
        
        .senior-mode * {
            font-size: 1.15rem !important;
            line-height: 1.6 !important;
        }
        
        .senior-mode body,
        .senior-mode p,
        .senior-mode span,
        .senior-mode label,
        .senior-mode button,
        .senior-mode div {
            font-size: 1.15rem !important;
            line-height: 1.6 !important;
        }
        
        .senior-mode input,
        .senior-mode select,
        .senior-mode textarea {
            font-size: 1rem !important;
            line-height: 1.6 !important;
        }
        
        .senior-mode h1,
        .senior-mode h2,
        .senior-mode h3,
        .senior-mode h4 {
            font-size: 1.3rem !important;
            line-height: 1.6 !important;
            font-weight: 800 !important;
        }
    </style>
</head>
<body class="antialiased flex justify-center min-h-screen pb-24 bg-twilightBg">

    <div id="app" :class="{'senior-mode': isSeniorFont}" class="w-full max-w-md bg-twilightPaper min-h-screen relative flex flex-col shadow-2xl">
        
        <div v-if="!isMounted" class="bg-twilightBg p-12 text-center my-auto flex flex-col items-center justify-center space-y-6 min-h-screen w-full">
            <div class="animate-spin text-twilightSand text-5xl"><i class="fa-solid fa-compass"></i></div>
            <p class="text-xl font-bold font-title tracking-widest text-twilightPaper">GOLDEN VOYAGE</p>
            <p class="text-[13px] text-twilightSand font-medium tracking-wide">成員：姿綾、琬棋、媽媽、小阿姨</p>
            <p class="text-xs text-twilightSand/80 leading-relaxed font-light">
                正為您部署金廈深度航行手冊...
            </p>
        </div>

        <template v-if="isMounted">
            
            <div class="p-4 bg-twilightBg text-white relative">
                <div class="relative w-full h-[180px] rounded-[18px] overflow-hidden group border border-twilightSand/20 shadow-lg">
                    <img :src="bannerImg" alt="金廈旅圖" class="w-full h-full object-cover transition-transform duration-700 hover:scale-105">
                </div>

                <div class="mt-3 flex flex-col space-y-2">
                    <!-- 🌟 【核心】長輩字體放大控制面板 -->
                    <div class="flex justify-between items-center bg-twilightSlate/40 p-2 rounded-[12px] border border-twilightSand/15">
                        <span class="text-[11px] text-twilightPaper font-bold flex items-center space-x-1.5">
                            <i class="fa-solid fa-magnifying-glass-plus text-twilightSand"></i>
                            <span>長輩閱讀模式：</span>
                        </span>
                        <div class="flex space-x-1">
                            <button @click="isSeniorFont = false" :class="!isSeniorFont ? 'bg-twilightSand text-twilightBg' : 'bg-twilightSlate text-twilightPaper/60'" class="px-3 py-1 rounded-lg text-[9px] font-bold transition cursor-pointer">
                                標準字 ⚖️
                            </button>
                            <button @click="isSeniorFont = true" :class="isSeniorFont ? 'bg-red-500 text-white animate-pulse' : 'bg-twilightSlate text-twilightPaper/60'" class="px-3 py-1 rounded-lg text-[9px] font-bold transition cursor-pointer">
                                放大字 🔎
                            </button>
                        </div>
                    </div>

                    <div class="flex justify-between items-center bg-twilightSlate/60 p-2.5 rounded-[12px] border border-twilightSand/15 text-[10px] text-twilightPaper font-medium">
                        <div class="flex items-center space-x-2">
                            <span class="w-2 h-2 bg-twilightSand rounded-full animate-ping"></span>
                            <span class="opacity-80">廈門回憶製造所：一路同行，一路珍藏</span>
                        </div>
                        <span class="text-[9px] bg-twilightSand/20 text-twilightSand border border-twilightSand/30 px-2.5 py-0.5 rounded-full font-bold">行程準備就緒 🚢</span>
                    </div>
                </div>
            </div>

            <div class="p-4 flex-1 pb-16">
                <div v-if="currentTab === 'plan'" class="space-y-4">
                    <div class="flex space-x-2 overflow-x-auto pb-1.5 no-scrollbar">
                        <button v-for="(d, idx) in dates" :key="idx" @click="activeDateIdx = idx"
                                :class="activeDateIdx === idx ? 'bg-twilightBg text-twilightSand shadow-md border-twilightSand' : 'bg-white text-twilightMuted border-transparent'"
                                class="flex flex-col items-center justify-center min-w-[70px] h-[78px] rounded-[16px] shadow-luxury-sm transition-all shrink-0 border-2 cursor-pointer">
                            <span class="text-[9px] font-bold tracking-widest uppercase" :class="activeDateIdx === idx ? 'text-twilightSand' : 'text-twilightMuted'">{{ d.week }}</span>
                            <span class="text-base font-black mt-1 tracking-tight">{{ d.day }}</span>
                        </button>
                    </div>

                    <div class="bg-white p-3.5 rounded-[16px] border border-twilightSand/25 shadow-luxury-sm space-y-2.5">
                        <div class="flex justify-between items-center border-b border-stone-100 pb-1.5">
                            <span class="text-xs font-bold text-twilightBg flex items-center space-x-1.5">
                                <i class="fa-solid fa-cloud-sun text-twilightSand animate-pulse"></i>
                                <span>今日天氣與環境狀態</span>
                            </span>
                            <span class="text-[11px] font-mono font-black text-twilightSand bg-twilightBg px-2 py-0.5 rounded">{{ activeDateWeather.temp }}</span>
                        </div>
                        <p class="text-[11px] text-twilightMuted leading-relaxed">
                            🌤️ {{ activeDateWeather.desc }}
                        </p>
                        <div class="border-t border-dashed border-stone-200/60 pt-2 flex flex-col space-y-1">
                            <span class="text-[10px] font-bold text-twilightSlate flex items-center space-x-1.5">
                                <i class="fa-solid fa-ship text-sky-500"></i>
                                <span>今日船班 / 大眾運輸狀態監控</span>
                            </span>
                            <p class="text-[11px] text-twilightMuted leading-relaxed font-light">
                                {{ activeDateWeather.transitStatus }}
                            </p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white border-t border-stone-200/50 rounded-t-luxury shadow-[0_-8px_24px_rgba(11,25,44,0.06)] px-1 py-3 grid grid-cols-6 text-center z-40">
                <button @click="currentTab = 'plan'" :class="currentTab === 'plan' ? 'text-twilightBg font-bold' : 'text-twilightMuted'" class="flex flex-col items-center justify-center py-0.5 transition cursor-pointer">
                    <i class="fa-solid fa-calendar-minus text-sm"></i><span class="text-[8px] mt-1 tracking-wider scale-95">行程</span>
                </button>
            </div>

        </template>

    </div>

    <script>
        const { createApp, ref, computed, onMounted } = Vue;

        createApp({
            setup() {
                const isMounted = ref(false);
                const currentTab = ref('plan');
                const activeDateIdx = ref(0);
                const isSeniorFont = ref(false);

                const dates = [
                    { day: '18', week: 'Thu' }, { day: '19', week: 'Fri' },
                    { day: '20', week: 'Sat' }, { day: '21', week: 'Sun' }, { day: '22', week: 'Mon' }
                ];

                const dailyConditions = [
                    {
                        temp: '28°C ~ 32°C',
                        desc: '今日出發，金門與廈門晴朗微風，海面風浪平穩。',
                        transitStatus: '🚢 新五緣輪正常準點；✈️ 立榮航空正常起降。'
                    },
                    {
                        temp: '27°C ~ 31°C',
                        desc: '多雲時晴，海邊微風涼爽。',
                        transitStatus: '🚢 鼓浪嶼渡輪正常；🚇 跨海地鐵正常營運。'
                    },
                    {
                        temp: '29°C ~ 33°C',
                        desc: '天氣晴朗酷熱，紫外線極高。',
                        transitStatus: '🚗 市區路段正常。'
                    },
                    {
                        temp: '26°C ~ 30°C',
                        desc: '局部午後雷陣雨，降雨機率約45%。',
                        transitStatus: '🚐 商務包車已確認出發。'
                    },
                    {
                        temp: '27°C ~ 31°C',
                        desc: '晴天，金門微風適宜。',
                        transitStatus: '🚢 返金船班正常；✈️ 返台航班正常。'
                    }
                ];

                const activeDateWeather = computed(() => {
                    return dailyConditions[activeDateIdx.value] || { temp: '28°C', desc: '晴朗舒適', transitStatus: '正常' };
                });

                const bannerTitle = ref('金門 x 廈門 雙城深度慢旅');
                const bannerSub = ref('歷史洋樓與絕美土樓探索之旅 • 6/18 - 6/22');
                const bannerImg = ref('https://images.unsplash.com/photo-1599839616713-90924976fc9e?q=80&w=800');

                onMounted(() => {
                    isMounted.value = true;
                });

                return {
                    isMounted,
                    currentTab,
                    activeDateIdx,
                    isSeniorFont,
                    dates,
                    activeDateWeather,
                    bannerTitle,
                    bannerSub,
                    bannerImg
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
