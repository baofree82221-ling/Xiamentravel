<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>🧭 廈門回憶製造所 • 尊榮深度探索手冊</title>
    
    <!-- 輕奢風格專用 CDN 函式庫 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- 輕量級高畫質地圖 Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        twilightBg: '#0B192C',     // 暮光深海暗藍
                        twilightSlate: '#1E3E62',  // 沉穩海藍灰
                        twilightSand: '#D4AD68',   // 溫潤暖沙金
                        twilightPaper: '#FAF9F6',  // 優雅石膏白紙
                        twilightMuted: '#111111',  // 全域消滅灰色，改為清晰黑色
                        twilightCard: '#FFFFFF'    // 紙張純白
                    },
                    borderRadius: {
                        'luxury': '22px'
                    }
                }
            }
        }
    </script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Noto+Sans+TC:wght@500;700;900&display=swap');
        
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #0B192C;
            color: #111111;
            -webkit-tap-highlight-color: transparent;
        }
        
        .font-title {
            font-family: 'Cinzel', 'Noto Sans TC', serif;
        }

        /* 暮光奢華質感精緻陰影 */
        .shadow-luxury { 
            box-shadow: 0 16px 36px -8px rgba(11, 25, 44, 0.15), 0 4px 16px -3px rgba(212, 173, 104, 0.15); 
            border: 1.5px solid rgba(212, 173, 104, 0.3);
        }
        
        .shadow-luxury-sm { 
            box-shadow: 0 6px 20px -4px rgba(11, 25, 44, 0.1); 
            border: 1px solid rgba(212, 173, 104, 0.2); 
        }
        
        /* 隱藏滾動條 */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .safe-bottom { padding-bottom: calc(env(safe-area-inset-bottom) + 0.6rem); }
        
        /* 深度轉場動畫 */
        .fade-enter-active, .fade-leave-active { transition: opacity 0.3s ease, transform 0.3s ease; }
        .fade-enter-from, .fade-leave-to { opacity: 0; transform: translateY(8px); }

        /* 地圖固定容器比例 */
        #itinerary-map {
            height: 290px;
            width: 100%;
            z-index: 10;
            border-radius: 16px;
        }
    </style>
</head>
<body class="antialiased flex justify-center min-h-screen pb-24 bg-twilightBg select-none">

    <div id="app" class="w-full max-w-md bg-twilightPaper min-h-screen relative flex flex-col shadow-2xl">
        
        <!-- 🏆【第一頁專屬啟動封面：廈門回憶製造所】儀式感滿分 -->
        <div v-if="!isBookOpened" class="bg-twilightBg p-8 text-center flex flex-col items-center justify-between min-h-screen w-full relative overflow-hidden border-4 border-twilightSand">
            <!-- 裝飾花紋 -->
            <div class="absolute -top-10 -left-10 w-32 h-32 rounded-full border-2 border-twilightSand/20 pointer-events-none"></div>
            <div class="absolute -bottom-10 -right-10 w-32 h-32 rounded-full border-2 border-twilightSand/20 pointer-events-none"></div>
            
            <div class="my-auto space-y-8 w-full z-10">
                <div class="w-24 h-24 bg-gradient-to-br from-twilightSand to-amber-200 rounded-full flex items-center justify-center mx-auto shadow-2xl border border-twilightSand">
                    <i class="fa-solid fa-book-open text-twilightBg text-4xl"></i>
                </div>
                
                <div class="space-y-4">
                    <p class="text-xs tracking-widest text-twilightSand/90 uppercase font-title">GOLDEN MEMORIES</p>
                    <h1 class="text-3xl font-black tracking-wide text-twilightPaper leading-snug">
                        廈門回憶製造所
                    </h1>
                    <p class="text-sm text-twilightSand tracking-widest font-medium">「 一路同行，一路珍藏 」</p>
                </div>

                <div class="bg-white/5 p-4 rounded-2xl border border-twilightSand/30 max-w-xs mx-auto">
                    <p class="text-[10px] text-twilightSand/75 tracking-wider uppercase mb-2">專屬漫遊成員</p>
                    <div class="flex flex-wrap justify-center gap-2">
                        <span v-for="m in travelers" :key="m" class="text-xs bg-twilightSand/20 text-twilightPaper px-3 py-1 rounded-full border border-twilightSand/30 font-bold">
                            ✨ {{ m }}
                        </span>
                    </div>
                </div>
                
                <p class="text-xs text-twilightPaper/70 leading-relaxed font-light">
                    行程、天氣、地圖、公費、憑證夾已全數部署完畢
                </p>
            </div>

            <button @click="openHandbook" class="w-full max-w-xs bg-gradient-to-r from-twilightSand to-amber-200 text-twilightBg font-black py-4 rounded-xl shadow-2xl transition hover:scale-105 active:scale-95 duration-200 flex items-center justify-center space-x-2 text-sm border-2 border-white/20 mb-8 z-10">
                <i class="fa-solid fa-compass-navigational animate-spin"></i>
                <span>開啟我的漫遊手帳 🚢</span>
            </button>
        </div>

        <!-- Vue 正式框架內容區 -->
        <template v-if="isBookOpened">
            
            <!-- 👑 頂部主視覺 -->
            <div class="p-4 bg-twilightBg text-white relative">
                <div class="relative w-full h-[180px] rounded-[18px] overflow-hidden group border border-twilightSand/25 shadow-lg">
                    <img :src="bannerImg" alt="金廈旅圖" class="w-full h-full object-cover">
                    
                    <!-- 沉浸式漸層文案 -->
                    <div class="absolute inset-0 bg-gradient-to-t from-twilightBg via-black/10 to-transparent p-4 flex flex-col justify-end pointer-events-none">
                        <p class="text-[9px] font-bold tracking-widest text-twilightSand uppercase">COASTAL DISCOVERY BOOK</p>
                        <h2 class="text-xl font-black mt-0.5 tracking-wide font-title text-white">{{ bannerTitle }}</h2>
                        <p class="text-[10px] text-twilightPaper/90 mt-1 font-light tracking-wider">{{ bannerSub }}</p>
                    </div>

                    <!-- 👑 浮動編輯/設定按鈕 -->
                    <button @click="triggerBannerEdit" class="absolute top-3 right-3 z-30 bg-black/60 hover:bg-black/90 backdrop-blur-md text-twilightSand text-[10px] px-3 py-1.5 rounded-full shadow-md transition font-bold flex items-center space-x-1.5 border border-twilightSand/30 pointer-events-auto">
                        <i class="fa-solid fa-gear"></i>
                        <span>手帳設定</span>
                    </button>
                </div>

                <!-- 🌟 頂部公告 -->
                <div class="mt-3 flex flex-col space-y-2">
                    <div class="flex justify-between items-center bg-twilightSlate/60 p-2.5 rounded-[12px] border border-twilightSand/15 text-[12px] text-twilightPaper font-medium">
                        <div class="flex items-center space-x-2">
                            <span class="w-2.5 h-2.5 bg-green-400 rounded-full animate-ping"></span>
                            <span class="font-bold">廈門回憶製造所：一路同行，一路珍藏 </span>
                        </div>
                        <span class="text-[9px] bg-twilightSand text-twilightBg px-2.5 py-0.5 rounded-full font-bold">準備就緒 🚢</span>
                    </div>
                </div>
            </div>

            <!-- 主區塊 -->
            <div class="p-4 flex-1 pb-16">

                <!-- ==================== TAB 1: 行程計畫 (PLAN) ==================== -->
                <div v-if="currentTab === 'plan'" class="space-y-4">
                    
                    <!-- 輕奢風橫向滑動日期切換 -->
                    <div class="flex space-x-2 overflow-x-auto pb-1.5 no-scrollbar">
                        <button v-for="(d, idx) in dates" :key="idx" @click="activeDateIdx = idx"
                                :class="activeDateIdx === idx ? 'bg-twilightBg text-twilightSand shadow-md border-twilightSand' : 'bg-white text-twilightBg border-transparent'"
                                class="flex flex-col items-center justify-center min-w-[70px] h-[78px] rounded-[16px] shadow-luxury-sm transition-all shrink-0 border-2">
                            <span class="text-[9px] font-bold tracking-widest uppercase" :class="activeDateIdx === idx ? 'text-twilightSand' : 'text-twilightBg'">{{ d.week }}</span>
                            <span class="text-base font-black mt-1 tracking-tight">{{ d.day }}</span>
                        </button>
                    </div>

                    <!-- ⛅ 今日動態天氣與船班交通監控狀況 -->
                    <div class="bg-white p-3.5 rounded-[16px] border border-twilightSand/25 shadow-luxury-sm space-y-2.5">
                        <div class="flex justify-between items-center border-b border-stone-100 pb-1.5">
                            <span class="text-sm font-bold text-twilightBg flex items-center space-x-1.5">
                                <i class="fa-solid fa-cloud-sun text-twilightSand animate-pulse"></i>
                                <span>今日天氣與環境狀態</span>
                            </span>
                            <span class="text-[13px] font-mono font-black text-twilightSand bg-twilightBg px-2.5 py-0.5 rounded">{{ activeDateWeather.temp }}</span>
                        </div>
                        <p class="text-[13px] text-twilightMuted leading-relaxed font-bold">
                            🌤️ {{ activeDateWeather.desc }}
                        </p>
                        <div class="border-t border-dashed border-stone-200/60 pt-2 flex flex-col space-y-1">
                            <span class="text-[12px] font-bold text-twilightSlate flex items-center space-x-1.5">
                                <i class="fa-solid fa-ship text-sky-500"></i>
                                <span>今日船班 / 大眾交通運輸監控</span>
                            </span>
                            <p class="text-[13px] text-twilightMuted leading-relaxed font-bold">
                                {{ activeDateWeather.transitStatus }}
                            </p>
                        </div>
                    </div>

                    <!-- 每日住宿特惠提示 -->
                    <div class="bg-white p-3.5 rounded-[16px] border border-twilightSand/20 shadow-luxury-sm flex justify-between items-start text-xs">
                        <div class="space-y-1">
                            <span class="font-bold text-twilightBg flex items-center space-x-1.5">
                                <i class="fa-solid fa-hotel text-twilightSand"></i>
                                <span class="font-bold">落腳旅店：宜度・潮宿家庭房 (中山路步行街)</span>
                            </span>
                            <p class="text-twilightMuted leading-relaxed text-[11px] font-bold">
                                🍳 旅宿提供免費特惠家庭早餐 2 份（07:00-10:00）<br>
                                💡 <span class="text-amber-700 font-bold">貼心提醒：</span>Day 2 與 Day 3 使用此早餐最划算！
                            </p>
                        </div>
                    </div>

                    <!-- 行程篩選器 -->
                    <div class="flex items-center space-x-2 bg-white p-3 rounded-[16px] shadow-luxury-sm border border-twilightSand/10">
                        <span class="text-[10px] font-bold text-twilightMuted uppercase tracking-wider shrink-0">分類篩選：</span>
                        <select v-model="filterCategory" class="w-full bg-transparent text-xs font-bold text-twilightBg outline-none cursor-pointer">
                            <option value="全部">全部探索項目</option>
                            <option v-for="cat in categories" :key="cat" :value="cat">{{ cat }}</option>
                        </select>
                    </div>

                    <!-- 行程列表 -->
                    <div class="space-y-4">
                        <div v-for="(item, idx) in filteredSchedule" :key="item.id" class="relative">
                            
                            <div v-if="idx > 0" class="flex justify-center items-center py-2.5 text-xs font-black text-twilightBg bg-twilightSand/10 rounded-xl my-1 border border-twilightSand/20">
                                <span>{{ item.transitIcon || '🚗' }} 下一個目的地移動約 <span class="text-amber-700 underline font-black">{{ item.transitTime || '15' }}</span> 分鐘</span>
                            </div>

                            <!-- 精裝手帳卡片 -->
                            <div class="bg-white rounded-luxury shadow-luxury overflow-hidden flex flex-col relative group">
                                <div v-if="item.image && item.image.trim() !== ''" class="w-full h-48 relative bg-stone-100 overflow-hidden border-b border-stone-200">
                                    <img :src="item.image" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105" alt="景點照" onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=600&q=80'">
                                    <span class="absolute top-3 left-3 bg-twilightBg/95 backdrop-blur-md text-twilightSand text-[10px] font-black tracking-widest px-3 py-1 rounded-full uppercase border border-twilightSand/30 shadow-md">
                                        {{ item.category }}
                                    </span>
                                </div>

                                <div class="p-4 space-y-3">
                                    <div class="flex justify-between items-center">
                                        <div class="flex items-center space-x-2">
                                            <span class="text-xs font-mono font-black px-3 py-1.5 rounded-md bg-twilightBg text-twilightSand">
                                                {{ item.time }}
                                            </span>
                                            <span v-if="isKeyTime(item.time, item.dateIdx)" class="text-[9px] text-white font-black bg-red-600 border border-red-700 px-2 py-0.5 rounded shadow-sm animate-pulse">重要出發時段！</span>
                                        </div>
                                        <div class="flex items-center space-x-2 text-xs text-twilightMuted">
                                            <button @click="moveItem(idx, -1)" class="p-1.5 bg-stone-100 rounded hover:bg-twilightSand hover:text-twilightBg transition" title="往上移">▲</button>
                                            <button @click="moveItem(idx, 1)" class="p-1.5 bg-stone-100 rounded hover:bg-twilightSand hover:text-twilightBg transition" title="往下移">▼</button>
                                        </div>
                                    </div>
                                    
                                    <h3 class="text-base font-black text-twilightBg tracking-wide leading-tight">{{ item.title }}</h3>
                                    
                                    <div class="text-sm text-twilightMuted space-y-2 bg-twilightPaper p-3.5 rounded-xl border-2 border-twilightSand/20 leading-relaxed font-black">
                                        <p v-if="item.ticket" class="font-black text-amber-800 bg-amber-50 p-1.5 rounded border border-amber-200">🎟️ 門票規章：{{ item.ticket }}</p>
                                        <p class="text-twilightBg font-black select-text">{{ item.notes }}</p>
                                    </div>

                                    <div class="pt-3 border-t border-dashed border-stone-100 flex justify-between items-center gap-2">
                                        <button @click="openGoogleMap(item.title)" class="text-xs bg-twilightBg text-twilightSand font-black px-4 py-2.5 rounded-xl hover:bg-twilightSlate transition flex items-center space-x-2 border border-twilightSand/30 shadow-sm">
                                            <i class="fa-solid fa-location-dot text-base"></i><span>開啟地圖導航</span>
                                        </button>
                                        <button @click="openEditModal(item)" class="text-xs text-amber-700 hover:underline font-black bg-amber-50 border border-amber-200 px-3 py-2.5 rounded-xl">編輯內容與配圖</button>
                                    </div>
                                </div>
                            </div>

                        </div>
                    </div>

                    <!-- 新增行程項目懸浮按鈕 -->
                    <button @click="openAddModal" class="fixed bottom-24 right-6 z-30 bg-twilightBg text-twilightSand p-4.5 rounded-full shadow-luxury hover:scale-105 active:scale-95 transition-all border border-twilightSand/40">
                        <i class="fa-solid fa-plus text-base"></i>
                    </button>
                </div>

                <!-- ==================== TAB 2: 深度導覽與行程地圖 (GUIDE) ==================== -->
                <div v-if="currentTab === 'guide'" class="space-y-4">
                    
                    <div class="bg-white p-4 rounded-luxury shadow-luxury space-y-3">
                        <h3 class="text-xs font-bold text-twilightBg flex items-center justify-between border-b border-stone-100 pb-2">
                            <span class="flex items-center space-x-1.5">
                                <i class="fa-solid fa-map-location-dot text-twilightSand"></i>
                                <span>金門 x 廈門 尊榮航行軌跡圖</span>
                            </span>
                            <span class="text-[9px] bg-twilightSand/10 text-twilightSand px-2 py-0.5 rounded border border-twilightSand/20 font-bold">動態地圖</span>
                        </h3>
                        
                        <div class="relative rounded-lg overflow-hidden border border-twilightSand/20 shadow-inner">
                            <div id="itinerary-map"></div>
                        </div>

                        <!-- 快捷跳轉地標 -->
                        <div class="space-y-1.5">
                            <p class="text-[9px] text-twilightMuted font-bold uppercase tracking-wider">點擊快速定位景點標記：</p>
                            <div class="flex flex-wrap gap-1.5">
                                <button v-for="pt in mapPoints" :key="pt.name" @click="focusMapPoint(pt)" class="text-[9px] bg-twilightBg hover:bg-twilightSlate text-twilightSand font-semibold px-2 py-1 rounded border border-twilightSand/25 transition">
                                    📍 {{ pt.name }}
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- 精裝雜誌排版風格導覽 -->
                    <div class="bg-white p-5 rounded-luxury shadow-luxury space-y-6">
                        <div class="text-center pb-4 border-b border-twilightSand/20">
                            <p class="text-[9px] font-bold tracking-widest text-twilightSand uppercase">CULTURAL GEOGRAPHY</p>
                            <h2 class="text-base font-black font-title text-twilightBg mt-1">金廈地理誌與人文深度特考</h2>
                            <div class="w-10 h-[2px] bg-twilightSand/60 mx-auto mt-2.5"></div>
                        </div>

                        <!-- 景點介紹 1 -->
                        <div class="space-y-2">
                            <div class="flex items-center space-x-2">
                                <span class="text-[9px] bg-twilightSand/15 text-twilightSand border border-twilightSand/20 px-2 py-0.5 rounded font-bold">萬國博覽</span>
                                <h3 class="text-xs font-bold text-twilightBg">🗺️ 鼓浪嶼：鋼琴之島與萬國領事建築群</h3>
                            </div>
                            <p class="text-[11px] text-twilightMuted leading-relaxed font-bold bg-stone-50 p-3 rounded-xl border border-stone-200">
                                鼓浪嶼因漲潮時海浪擊石、聲如擂鼓而得名。自1843年廈門開埠後，多國陸續在此設立領事館、商行、別墅與教堂。全島因而保留了維多利亞式、巴洛克式與折衷主義等西方古典建築。
                                <span class="block mt-1.5 italic text-amber-700 font-bold">💡 漫遊冷知識：全島完全禁止任何機動車輛（除救護車與消防車外），是一座極為天然的露天步行建築博物館！</span>
                            </p>
                        </div>

                        <!-- 景點介紹 2 -->
                        <div class="space-y-2 border-t border-dashed border-stone-100 pt-4">
                            <div class="flex items-center space-x-2">
                                <span class="text-[9px] bg-amber-50 text-amber-700 border border-amber-200 px-2 py-0.5 rounded font-bold">中西合璧</span>
                                <h3 class="text-xs font-bold text-twilightBg">🏫 集美學村：陳嘉庚先生的「嘉庚風格」殿堂</h3>
                            </div>
                            <p class="text-[11px] text-twilightMuted leading-relaxed font-bold bg-stone-50 p-3 rounded-xl border border-stone-200">
                                由著名愛國華僑領袖陳嘉庚先生一手創辦。這裡的校園建築群極具特色，俗稱「穿西裝、戴斗笠」——即採用西式的鋼筋混凝土結構、大窗、高挑立面（西裝），卻配上傳統中式飛簷翹角、琉璃瓦頂（斗笠），充分體現了南洋華僑心繫家鄉的浪漫人文精神。
                            </p>
                        </div>

                        <!-- 景點介紹 3 -->
                        <div class="space-y-2 border-t border-dashed border-stone-100 pt-4">
                            <div class="flex items-center space-x-2">
                                <span class="text-[9px] bg-sky-50 text-sky-600 border border-sky-200 px-2 py-0.5 rounded font-bold">漁港記憶</span>
                                <h3 class="text-xs font-bold text-twilightBg">🎨 沙坡尾避風塢：老廈門的起點與文創大本營</h3>
                            </div>
                            <p class="text-[11px] text-twilightMuted leading-relaxed font-bold bg-stone-50 p-3 rounded-xl border border-stone-200">
                                沙坡尾是廈門最古老的港口之一，也是昔日漁民停泊船隻、售賣海鮮的天然避風塢。如今這裡雖不再有大規模漁業運作，但保留了傳統的木質石造駁岸。近年在極富創意的設計師與青年職人改造下，成為了集合獨立咖啡館、藝文沙龍、夕陽落日打卡步道與原生態閩南市井氣息並存的精緻街區。
                             </p>
                        </div>

                        <!-- 景點介紹 4 -->
                        <div class="space-y-2 border-t border-dashed border-stone-100 pt-4">
                            <div class="flex items-center space-x-2">
                                <span class="text-[9px] bg-rose-50 text-red-500 border border-red-200 px-2 py-0.5 rounded font-bold">世界遺產</span>
                                <h3 class="text-xs font-bold text-twilightBg">🧱 南靖土樓：建在沼澤地上的和貴樓</h3>
                            </div>
                            <p class="text-[11px] text-twilightMuted leading-relaxed font-bold bg-stone-50 p-3 rounded-xl border border-stone-200">

                            let width = img.width;

                                    width = MAX_WIDTH;

                            } else {
                                if (height > MAX_HEIGHT) {

                };

                // 伴手禮
                const openAddSouvenirModal = () => {
                    isEditingSouvenir.value = false;
                    formSouvenir.value = {
                        id: 'sov_' + Date.now(),
                        location: '',
                        icon: '🛍️',
                        items: []
                    };
                    newSubItemName.value = '';
                    showSouvenirModal.value = true;
                };

                const openEditSouvenirModal = (shop) => {
                    isEditingSouvenir.value = true;
                    formSouvenir.value = {
                        id: shop.id || 'sov_' + Date.now(),
                        location: shop.location,
                        icon: shop.icon || '🛍️',
                        items: shop.items.map(item => ({ ...item }))
                    };
                    newSubItemName.value = '';
                    showSouvenirModal.value = true;
                };

                const addSubItem = () => {
                    if (!newSubItemName.value.trim()) return;
                    formSouvenir.value.items.push({
                        name: newSubItemName.value.trim(),
                        checked: false
                    });
                    newSubItemName.value = '';
                };

                const removeSubItem = (idx) => {
                    formSouvenir.value.items.splice(idx, 1);
                };

                const saveSouvenirShop = () => {
                    if (!formSouvenir.value.location.trim()) {
                        showToast('請填寫商店或地點名稱！');
                        return;
                    }
                    if (isEditingSouvenir.value) {
                        const index = souvenirs.value.findIndex(s => s.id === formSouvenir.value.id);
                        if (index !== -1) {
                            souvenirs.value[index] = { ...formSouvenir.value };
                        } else {
                            const locIdx = souvenirs.value.findIndex(s => s.location === formSouvenir.value.location);
                            if (locIdx !== -1) souvenirs.value[locIdx] = { ...formSouvenir.value };
                        }
                        showToast('伴手禮商店編輯成功！');
                    } else {
                        souvenirs.value.push({ ...formSouvenir.value });
                        showToast('成功新增伴手禮商店！');
                    }
                    showSouvenirModal.value = false;
                };

                const deleteSouvenirShop = (shop) => {
                    souvenirs.value = souvenirs.value.filter(s => s.id !== shop.id && s.location !== shop.location);
                    showToast('伴手禮商店已移除。');
                };

                const openGoogleMap = (query) => {
                    window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(query)}`, '_blank');
                };

                const getExpenseIcon = (cat) => {
                    switch(cat) {
                        case '交通': return '🚗';
                        case '美食': return '🍱';
                        case '住宿': return '🏨';
                        case '門票': return '🎟️';
                        case '購物': return '🛍️';
                        default: return '💰';
                    }
                };

                return {
                    isMounted, isBookOpened, openHandbook, currentTab, activeDateIdx, filterCategory, exchangeRate, initialPublicFund, remainingPublicFund,
                    dates, categories, travelers, todos, souvenirs, expenses, newExpense, calcExpression, calcValue, tempCompressedImg, photoViewerUrl,
                    filteredSchedule, showModal, isEditing, formItem, personalMemo, parsedLinks, mapPoints, vaultDocs, newDoc, tempDocImg, tempDocImgUrl,
                    showBannerModal, bannerTitle, bannerSub, bannerImg, tempBannerTitle, tempBannerSub, tempBannerImg,
                    showPublicFundModal, tempPublicFund, toastMessage, showConfirmModal, activeDateWeather,
                    showSouvenirModal, isEditingSouvenir, formSouvenir, newSubItemName, forceResetAll,
                    showEditDocModalState, editDocForm, openEditDocModal, saveEditedDoc, onEditDocPhotoUploaded,
                    exportHandbookData, importHandbookData, handleImageError,
                    openAddSouvenirModal, openEditSouvenirModal, addSubItem, removeSubItem, saveSouvenirShop, deleteSouvenirShop,
                    triggerBannerEdit, saveBannerSettings, openPublicFundModal, savePublicFund, calcResult, evalCalc, onPhotoUploaded, viewFullPhoto,
                    openAddModal, openEditModal, saveItem, confirmDeleteItem, executeDeleteItem, moveItem, addExpense, deleteExpense, openGoogleMap, getExpenseIcon, isKeyTime,
                    focusMapPoint, onDocPhotoUploaded, saveDoc, deleteDoc
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
