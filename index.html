<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>🧭 金門・廈門 輕裝小三通漫旅 ｜ 秘境悠遊小手帳</title>
    
    <!-- Tailwind CSS, Vue 3, FontAwesome CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Noto Sans TC"', 'sans-serif'],
                        serif: ['"Noto Serif TC"', 'serif']
                    },
                    colors: {
                        bookBg: '#FAF7F0',       // 暖黃白日系手帳奶油底
                        bookPaper: '#FFFFFF',    // 紙張白
                        bookInk: '#2C302E',      // 深森炭灰黑
                        bookGold: '#D9A05B',     // 暖陽麥黃
                        bookGreen: '#5F7161',    // 文青草本深綠/苔綠
                        bookBlue: '#6D8294',     // 霧霾暮藍
                        bookRed: '#C05C5C',      // 暖陽赤磚紅
                        bookShadow: '#E4DDD3'    // 輕柔沙灰陰影
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700;900&display=swap');
        
        body {
            background-color: #FAF7F0;
            background-image: 
                linear-gradient(to right, rgba(228, 221, 211, 0.4) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(228, 221, 211, 0.4) 1px, transparent 1px);
            background-size: 20px 20px;
            color: #2C302E;
            -webkit-tap-highlight-color: transparent;
            font-family: "Noto Sans TC", sans-serif;
        }
        
        /* 日系手帳軟立體陰影 */
        .shadow-vintage { box-shadow: 5px 5px 0px #E4DDD3; border: 2px solid #2C302E; }
        .shadow-vintage-sm { box-shadow: 3px 3px 0px #E4DDD3; border: 2px solid #2C302E; }
        .btn-vintage-active:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0px #E4DDD3; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        /* 日系膠帶與拍立得框 */
        .washi-tape {
            background: rgba(95, 113, 97, 0.25);
            background-image: radial-gradient(rgba(44, 48, 46, 0.1) 15%, transparent 16%);
            background-size: 8px 8px;
        }
    </style>
</head>
<body class="antialiased flex justify-center min-h-screen pb-28">

    <div id="app" class="w-full max-w-md px-4 pt-4 flex flex-col space-y-4">
        
        <!-- 載入中動畫 -->
        <div v-if="!isMounted" class="bg-white p-8 rounded-[16px] shadow-vintage text-center my-auto space-y-4">
            <p class="text-xl font-bold font-serif">🌿 正在翻開日系森系手帳...</p>
            <p class="text-xs text-stone-400 leading-relaxed">
                正在為您調整思源字體、草本配色與海況動態看板，請稍候...
            </p>
        </div>

        <!-- 正式掛載結構 -->
        <template v-if="isMounted">
            
            <!-- 日系手帳封面頭部 -->
            <div class="relative bg-white border-2 border-bookInk rounded-[20px] shadow-vintage overflow-hidden p-4 flex flex-col space-y-3">
                
                <!-- 日系文青膠帶裝飾 -->
                <div class="absolute -top-1 left-12 w-24 h-6 washi-tape rotate-6 z-20 opacity-90 border-b border-stone-200"></div>

                <!-- 相片管理面板齒輪按鈕 -->
                <button @click="showPhotoConfig = !showPhotoConfig" class="absolute top-3 right-3 z-30 bg-bookInk text-white w-8 h-8 rounded-full flex items-center justify-center hover:bg-bookGreen transition-colors shadow-md border border-bookBg/40">
                    <i class="fa-solid fa-gear" :class="{'fa-spin': showPhotoConfig}"></i>
                </button>

                <!-- 封面拍立得相框 -->
                <div class="relative w-full h-[160px] bg-stone-50 rounded-[12px] overflow-hidden border-2 border-bookInk shadow-inner">
                    <img :src="photoUrls.banner || 'banner.jpg'" alt="金廈大冒險" class="w-full h-full object-cover" @error="handleBannerError">
                    <div class="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-bookInk via-bookInk/65 to-transparent p-3 text-white">
                        <p class="text-[9px] uppercase tracking-widest text-bookGold font-bold">⏱️ Jun 18 - Jun 22 / 輕裝小三通慢旅</p>
                        <h2 class="text-base font-bold font-serif">金門 × 廈門 秘境悠遊小手帳</h2>
                    </div>
                </div>

                <!-- 出發狀態 -->
                <div class="flex justify-between items-center bg-bookBg/80 p-2.5 rounded-[12px] border border-bookInk/10 text-xs font-bold">
                    <span class="text-stone-600"><i class="fa-solid fa-seedling mr-1 text-bookGreen"></i> 出發起點：岡山捷運 ➔</span>
                    <span class="text-bookGreen font-serif font-bold text-xs bg-white px-3 py-0.5 rounded border border-bookInk/20 shadow-sm"> READY 🌿</span>
                </div>
            </div>

            <!-- ==================== 一鍵相片管理面板 ⚙️ ==================== -->
            <div v-if="showPhotoConfig" class="bg-stone-800 text-stone-200 p-4 rounded-[20px] shadow-vintage border-2 border-bookInk space-y-3 text-xs">
                <div class="flex justify-between items-center border-b border-stone-600 pb-1.5">
                    <span class="font-bold text-bookGold text-sm font-serif"><i class="fa-solid fa-sliders mr-1"></i> 專屬相片網址自訂面板</span>
                    <button @click="showPhotoConfig = false" class="text-stone-400 hover:text-white">✕</button>
                </div>
                <div class="space-y-2">
                    <div>
                        <label class="block text-[11px] text-stone-400 mb-0.5">首頁 Banner 相片網址：</label>
                        <input v-model="photoUrls.banner" type="text" placeholder="輸入圖片網址..." class="w-full bg-stone-700 border border-stone-600 rounded px-2 py-1 text-white text-[11px]">
                    </div>
                    <div v-for="n in 5" :key="n">
                        <label class="block text-[11px] text-stone-400 mb-0.5">Day {{ n }} 行程卡片首圖：</label>
                        <input v-model="photoUrls['day'+n]" type="text" placeholder="輸入圖片網址..." class="w-full bg-stone-700 border border-stone-600 rounded px-2 py-1 text-white text-[11px]">
                    </div>
                </div>
                <div class="pt-1 flex justify-end space-x-2">
                    <button @click="resetPhotos" class="bg-stone-600 text-stone-300 px-3 py-1 rounded hover:bg-stone-500 font-bold">還原預設</button>
                    <button @click="savePhotos" class="bg-bookGold text-bookInk px-4 py-1 rounded font-bold hover:bg-yellow-500">儲存變更</button>
                </div>
            </div>

            <!-- ==================== TAB 1: 每日行程表 (Schedule) ==================== -->
            <div v-if="currentTab === 'schedule'" class="space-y-4">
                
                <!-- 日系滑動日期標籤 -->
                <div class="flex space-x-2 overflow-x-auto pb-1 no-scrollbar">
                    <button v-for="(d, idx) in dates" :key="idx" @click="activeDateIdx = idx"
                            :class="activeDateIdx === idx ? 'bg-bookGreen text-white border-bookGreen' : 'bg-white text-bookInk border-stone-200'"
                            class="flex flex-col items-center justify-center min-w-[68px] h-[72px] rounded-[14px] border-2 shadow-vintage-sm btn-vintage-active transition-all shrink-0">
                        <span class="text-[10px] font-bold tracking-tight" :class="activeDateIdx === idx ? 'text-white/80' : 'text-stone-400'">{{ d.week }}</span>
                        <span class="text-base font-bold font-serif mt-0.5">{{ d.day }}</span>
                    </button>
                </div>

                <!-- 智能天氣與船班海況動態看板 -->
                <div class="bg-white p-3.5 rounded-[16px] border-2 border-bookInk flex justify-between items-center text-xs shadow-vintage-sm">
                    <div class="flex items-start space-x-2.5">
                        <span class="text-2xl mt-0.5">{{ currentWeather.icon }}</span>
                        <div class="space-y-1">
                            <span class="font-bold text-bookInk text-xs font-serif"><i class="fa-solid fa-feather-pointed text-bookGreen mr-1"></i>今日氣象與海象手記：</span>
                            <p class="text-stone-600 text-[11px] font-medium leading-tight">{{ currentWeather.desc }}</p>
                            <p class="text-bookBlue text-[10px] font-bold bg-stone-50 border border-bookBlue/20 px-2 py-0.5 rounded inline-block">
                                <i class="fa-solid fa-ship mr-1"></i>{{ currentWeather.seaState }}
                            </p>
                        </div>
                    </div>
                    <div class="font-mono font-bold text-bookInk text-xs bg-bookBg border border-bookInk/20 px-2 py-1 rounded-md text-center shrink-0 shadow-sm">
                        體感<br><span class="text-bookRed font-bold text-sm">{{ currentWeather.temp }}</span>
                    </div>
                </div>

                <!-- 分類篩選 -->
                <div class="flex items-center space-x-2 bg-white p-2.5 rounded-[12px] border-2 border-bookInk">
                    <span class="text-[11px] font-bold text-stone-400 shrink-0"><i class="fa-solid fa-filter mr-1"></i>篩選手記：</span>
                    <select v-model="filterCategory" class="w-full bg-transparent text-xs font-bold text-bookInk outline-none cursor-pointer">
                        <option value="全部">顯示全部旅程項目</option>
                        <option v-for="cat in categories" :key="cat" :value="cat">{{ cat }}</option>
                    </select>
                </div>

                <!-- 行程卡片清單 -->
                <div class="space-y-4">
                    <div v-for="(item, idx) in filteredSchedule" :key="item.id" class="relative">
                        
                        <!-- 預估交通耗時引導 -->
                        <div v-if="idx > 0" class="flex justify-center items-center py-2 text-[11px] font-bold text-stone-500 space-x-1.5">
                            <span>{{ item.transitIcon || '⏱️' }}</span>
                            <span class="bg-stone-200/40 px-2.5 py-0.5 rounded-full border border-stone-200 text-[10px]">預估移動大約需時 {{ item.transitTime || '15' }} 分鐘</span>
                        </div>

                        <!-- 每日出發起點說明 -->
                        <div v-if="idx === 0 && activeDateIdx > 0" class="mb-3 flex justify-center items-center py-2 bg-white border-2 border-dashed border-bookGreen/30 rounded-xl text-[11px] font-bold text-bookGreen shadow-sm">
                            <span>🏨 全日落腳：中山路步行街 ‧ 宜度・潮宿家庭房</span>
                        </div>

                        <!-- 古典探險手札卡片 -->
                        <div class="bg-white rounded-[16px] shadow-vintage overflow-hidden border-2 border-bookInk flex flex-col relative">
                            
                            <!-- 第一個景點照片區 -->
                            <div v-if="idx === 0" class="w-full h-44 relative bg-stone-100 overflow-hidden border-b-2 border-bookInk">
                                <img :src="photoUrls['day' + (activeDateIdx + 1)] || 'image_1ee31d.png'" 
                                     class="w-full h-full object-cover" 
                                     @error="handleDayImageError($event, activeDateIdx + 1)">
                                <span class="absolute top-3 left-3 bg-bookGreen text-white border border-white/20 text-[10px] font-bold px-2.5 py-0.5 rounded-md shadow-md font-serif">
                                    🗺️ FIELD PHOTO
                                </span>
                            </div>

                            <div class="p-4 space-y-2">
                                <div class="flex justify-between items-center">
                                    <span :class="getBadgeColor(item.category)" class="text-[10px] font-bold px-2.5 py-0.5 rounded border border-bookInk shadow-sm">
                                        {{ item.category }}
                                    </span>
                                    <span class="font-mono text-xs font-bold text-stone-500"><i class="fa-regular fa-clock mr-1"></i>{{ item.time }}</span>
                                </div>
                                
                                <h3 class="text-sm md:text-base font-bold font-serif text-bookInk leading-tight border-b border-stone-100 pb-1">{{ item.title }}</h3>
                                
                                <div class="text-[11px] text-stone-600 space-y-1 font-medium leading-relaxed">
                                    <!-- 手冊文字一模一樣呈現 -->
                                    <div class="text-stone-800 bg-bookBg/50 p-3 rounded-lg border border-dashed border-stone-300 whitespace-pre-line text-[11px] leading-relaxed">
                                        {{ item.notes }}
                                    </div>
                                </div>

                                <div class="pt-2 flex justify-between items-center">
                                    <button @click="openGoogleMap(item.title)" class="text-[10px] bg-bookBg border border-bookInk text-bookInk font-bold px-3 py-1.5 rounded-md btn-vintage-active flex items-center space-x-1 shadow-sm">
                                        <i class="fa-solid fa-location-dot text-bookRed"></i><span>地圖定位</span>
                                    </button>
                                    <div class="flex items-center space-x-1 text-stone-400">
                                        <button @click="moveItem(idx, -1)" class="p-1 text-[11px] hover:text-bookInk font-bold">▲</button>
                                        <button @click="moveItem(idx, 1)" class="p-1 text-[11px] hover:text-bookInk font-bold">▼</button>
                                        <span class="text-stone-200 mx-1">|</span>
                                        <button @click="openEditModal(item)" class="text-[10px] font-bold text-stone-400 hover:text-bookGold">修訂</button>
                                    </div>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>

                <!-- 訂房備忘簡化速覽 -->
                <div v-if="activeDateIdx === 1 || activeDateIdx === 2" class="p-3 bg-white border-2 border-bookInk rounded-[14px] text-xs font-bold shadow-vintage-sm">
                    <p class="text-bookGreen font-serif"><i class="fa-solid fa-mug-hot mr-1"></i> 今日提醒：宜度・潮宿早餐供應 (07:00-10:00)</p>
                    <p class="text-[10px] text-stone-500 mt-1 pl-4 font-normal">免費早餐 2 份：陳儀芳、陳怡靜。建議今日使用最划算！</p>
                </div>

                <!-- 浮動新增按鈕 -->
                <button @click="openAddModal" class="fixed bottom-20 right-[calc(50%-200px)] max-md:right-6 z-30 bg-bookGreen text-white p-3.5 rounded-full shadow-vintage hover:bg-bookInk transition-colors">
                    <i class="fa-solid fa-feather-pointed text-lg"></i>
                </button>
            </div>

            <!-- ==================== TAB 2: 預訂憑證 (Bookings) ==================== -->
            <div v-if="currentTab === 'bookings'" class="space-y-4">
                <div class="bg-white p-3 rounded-[12px] shadow-vintage-sm text-xs font-bold flex justify-between items-center border-2 border-bookInk">
                    <span>🔒 輸入憑證密碼解鎖：</span>
                    <input v-model="pinCode" type="password" placeholder="密碼" class="w-20 border border-bookInk rounded px-2 py-0.5 text-center font-bold text-sm bg-stone-50 focus:bg-white outline-none">
                </div>

                <div v-if="pinCode === '007'" class="space-y-4">
                    <!-- 去程航空 -->
                    <div class="bg-white rounded-[14px] shadow-vintage overflow-hidden border-2 border-bookInk">
                        <div class="bg-bookGold text-bookInk p-3 border-b-2 border-bookInk flex justify-between items-center font-bold text-[11px] tracking-wider font-serif">
                            <span>✈️ OUTBOUND FLIGHT BOARDING PASS</span>
                            <span class="font-mono">6/18 (四)</span>
                        </div>
                        <div class="p-4 grid grid-cols-1 gap-2 text-xs font-bold text-stone-800 leading-relaxed font-serif">
                            <div>去程航線：高雄小港 ➔ 金門 (約1小時)</div>
                            <div>班次班號：<span class="text-bookRed">立榮航空 B78920</span></div>
                            <div>報到時間：<span class="text-bookGreen font-mono">11:10-12:00 (最晚 11:30 到)</span></div>
                            <div>起飛時點：<span>13:30 正式起飛 (14:35抵達金門)</span></div>
                        </div>
                    </div>

                    <!-- 回程航空 -->
                    <div class="bg-white rounded-[14px] shadow-vintage overflow-hidden border-2 border-bookInk">
                        <div class="bg-bookRed text-white p-3 border-b-2 border-bookInk flex justify-between items-center font-bold text-[11px] tracking-wider font-serif">
                            <span>✈️ RETURN FLIGHT CONFIRMATION</span>
                            <span class="font-mono">6/22 (一)</span>
                        </div>
                        <div class="p-4 grid grid-cols-1 gap-2 text-xs font-bold text-stone-800 leading-relaxed font-serif">
                            <div>回程航線：金門機場 ➔ 高雄小港</div>
                            <div>返台還車：<span class="text-bookGreen">15:20 抵達機場辦理還車與託運</span></div>
                            <div>返港航班：<span>17:15 起飛返高</span></div>
                        </div>
                    </div>

                    <!-- 小三通船班憑證 -->
                    <div class="bg-white rounded-[14px] shadow-vintage overflow-hidden border-2 border-bookInk">
                        <div class="bg-bookBlue text-white p-3 border-b-2 border-bookInk flex justify-between items-center font-bold text-[11px] tracking-wider font-serif">
                            <span>🚢 CROSS-STRAIT FERRY TICKET</span>
                            <span class="font-mono">6/18 (四)</span>
                        </div>
                        <div class="p-4 text-xs font-bold space-y-2 text-stone-800 font-serif">
                            <p>船班名稱：<span class="font-black text-bookInk">新五緣輪</span></p>
                            <p>海港航線：金門水頭碼頭 ➔ 廈門五通碼頭</p>
                            <p>時間節點：<span class="text-bookRed">17:30 開船</span> (16:00前最晚抵達完成出境通關安檢)</p>
                            <div class="bg-stone-100 p-2.5 rounded-lg border border-bookInk/20 font-mono text-xs font-bold text-bookInk flex justify-between items-center">
                                <span>🎟️ 船班官方電子定位碼：</span>
                                <span class="bg-bookInk text-bookGold px-2.5 py-1 rounded font-bold border border-bookGold">NZAX7E</span>
                            </div>
                        </div>
                    </div>

                    <!-- 飯店入住詳細 -->
                    <div class="bg-white rounded-[14px] shadow-vintage p-4 text-xs font-bold space-y-2.5 border-2 border-bookInk font-serif">
                        <div class="flex justify-between items-center border-b-2 border-dashed border-stone-200 pb-2">
                            <h3 class="text-sm font-bold text-bookGreen">🏨 住所：宜度・潮宿家庭房</h3>
                            <span class="bg-stone-100 text-[10px] px-2 py-0.5 rounded border border-bookInk">中山路步行街</span>
                        </div>
                        <p class="text-stone-800">🍳 團隊免費早餐：提供 2 份 (登記人：陳儀芳、陳怡靜)</p>
                        <p class="text-stone-500 font-normal bg-bookBg/50 p-2.5 rounded-lg leading-relaxed text-[11px]">
                            ⏱️ 早餐供應時段 07:00 - 10:00。<br>
                            💡 建議在 Day 2 / Day 3 使用最為划算！
                        </p>
                    </div>
                </div>
                <div v-else class="text-center py-16 text-stone-400 text-xs font-bold leading-relaxed space-y-2">
                    <p>⚠️ 此欄位儲存重要憑證、訂房早餐姓名及船班定位碼。</p>
                    <p>請在上方輸入正確的解鎖密碼即可解鎖 (提示：007)。</p>
                </div>
            </div>

            <!-- ==================== TAB 3: 旅遊記帳 (Expense) ==================== -->
            <div v-if="currentTab === 'expense'" class="space-y-4">
                <!-- 記帳看板 -->
                <div class="bg-bookGreen text-bookBg p-5 rounded-[20px] shadow-vintage text-center border-2 border-bookInk">
                    <span class="text-[10px] font-bold block tracking-widest uppercase opacity-80">總體經費累計支出 (新台幣估算)</span>
                    <h2 class="text-3xl font-bold mt-1 font-serif">NT$ {{ totalExpenseTWD }} <span class="text-sm font-normal">元</span></h2>
                    <div class="mt-2 text-[10px] bg-black/20 py-1 px-3 rounded-full inline-block font-mono">
                        外幣記帳：¥ {{ totalExpenseRMB }} (匯率基準 4.5 換算)
                    </div>
                </div>

                <!-- 記帳表單 -->
                <div class="bg-white p-4 rounded-[16px] shadow-vintage text-xs font-bold space-y-3 border-2 border-bookInk">
                    <div class="grid grid-cols-2 gap-2.5">
                        <div>
                            <label class="block text-[10px] text-stone-500 mb-1">外幣金額 (RMB)</label>
                            <input v-model.number="newExpense.amount" type="number" placeholder="¥ 金額" class="w-full border-2 border-bookInk rounded-md p-2 font-mono text-xs outline-none bg-stone-50 focus:bg-white">
                        </div>
                        <div>
                            <label class="block text-[10px] text-stone-500 mb-1">消費項目</label>
                            <input v-model="newExpense.title" type="text" placeholder="例：海大富自助海鮮" class="w-full border-2 border-bookInk rounded-md p-2 text-xs outline-none bg-stone-50 focus:bg-white">
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-2.5">
                        <div>
                            <label class="block text-[10px] text-stone-500 mb-1">款項類別</label>
                            <select v-model="newExpense.category" class="w-full border-2 border-bookInk bg-transparent rounded-md p-2 cursor-pointer text-xs">
                                <option value="美食">🍱 美食饗宴</option>
                                <option value="交通">🚗 移防交通</option>
                                <option value="購物">🛍️ 特產伴手</option>
                                <option value="門票">🎟️ 景點門票</option>
                                <option value="住宿">🏨 精裝住所</option>
                                <option value="其他">🎈 其他雜支</option>
                            </select>
                        </div>
                        <div class="flex items-end">
                            <button @click="addExpense" class="w-full h-[38px] bg-bookGold border-2 border-bookInk text-bookInk font-bold rounded-md btn-vintage-active text-xs">入帳登記</button>
                        </div>
                    </div>
                </div>

                <!-- 記帳清單 -->
                <div class="bg-white rounded-[16px] shadow-vintage overflow-hidden divide-y-2 divide-stone-100 border-2 border-bookInk">

                    { id: 104, dIdx: 0, category: '交通', time: '17:30', title: '小三通啟航：新五緣輪', notes: '17:30 開船 船名:新五緣輪 定位碼:NZAX7E\n記得攜帶:護照/台胞證\n抵達廈門(約18:00-18:40) 入境通關出碼頭', transitTime: '10', transitIcon: '🎁' },
                    { id: 105, dIdx: 0, category: '景點', time: '18:00', title: '五通客運碼頭 「近便利」台胞專區', notes: '五通客運碼頭|辦理台胞相關服務(五通「近便利」台胞服務專區)\n。領取大禮包\n領取相關優惠券及旅遊資訊', transitTime: '20', transitIcon: '🚗' },
                    { id: 106, dIdx: 0, category: '住宿', time: '18:30', title: '宜度・潮宿 Check-in', notes: '前往飯店 宜度・潮宿(中山路步行街) 車程約15-25 分鐘\nCheck-in-放行李稍作休息(10-20分鐘)', transitTime: '15', transitIcon: '👓' },
                    { id: 107, dIdx: 0, category: '購物', time: '19:00-20:30', title: '精準專業配眼鏡行程', notes: '① 九九木眼鏡店:先挑款式/比價\n② 天虹購物中心 B1 眼鏡區(金湖路516號):驗光,可當天或隔天取件', transitTime: '5', transitIcon: '🍱' },

                    // Day 2
                    { id: 201, dIdx: 1, category: '景點', time: '08:30-13:00', title: '鼓浪嶼漫遊探索', notes: '08:30-09:00 前往郵輪中心廈鼓碼頭,搭船前往鼓浪嶼(建議至三丘田碼頭)\n推薦路線:最美轉角船屋-龍頭路商圈-日光岩周邊-菽莊花園外圍海景步道\n12:00-13:00 龍頭路小吃街午餐(葉氏麻糍、海蠣煎、沙茶麵、沈家腸粉)', transitTime: '30', transitIcon: '🚢' },
                    { id: 202, dIdx: 1, category: '景點', time: '14:00-16:00', title: '南普陀寺祈福參拜', notes: '南普陀寺(提前四天預約)\n天王殿、大雄寶殿、放生池寺院園區可祈福參拜，品嚐花生湯', transitTime: '30', transitIcon: '🚇' },
                    { id: 203, dIdx: 1, category: '交通', time: '16:30-18:00', title: '集美學村 ➔ 跨海海上小火車', notes: '集美學村|龍舟池、嘉庚建築群\n廈門地鐵1號線:集美學村站-高崎站(約 5-8 分鐘跨海路段)\n被譽為《神隱少女》現實版海上列車!建議坐右側靠窗欣賞夕陽海景', transitTime: '20', transitIcon: '🦀' },
                    { id: 204, dIdx: 1, category: '美食', time: '18:30-21:00', title: '第八市場(八市)海鮮饗宴', notes: '白灼蝦、清蒸魚、海蠣煎、沙茶麵、土筍凍、螃蟹\n周邊散步感受老廈門夜生活', transitTime: '0', transitIcon: '💤' },

                    // Day 3
                    { id: 301, dIdx: 2, category: '購物', time: '09:00-11:00', title: '江頭市場南北乾貨採買', notes: '江頭市場|推薦採買:干貝、魷魚乾、蝦米、茶葉、花生酥、鳳梨酥', transitTime: '20', transitIcon: '🏛️' },
                    { id: 302, dIdx: 2, category: '景點', time: '11:30-14:30', title: '集美學村巡禮 & 石鼓路美食', notes: '龍舟池、嘉庚建築群、歸來堂、陳嘉庚紀念館。午餐:石鼓路美食街', transitTime: '20', transitIcon: '🛍️' },
                    { id: 303, dIdx: 2, category: '購物', time: '15:00-17:00', title: 'SM城市廣場購物', notes: '逛街購物、咖啡下午茶、補買伴手禮與逆光伴手禮', transitTime: '20', transitIcon: '🌇' },
                    { id: 304, dIdx: 2, category: '景點', time: '17:30-21:30', title: '沙坡尾避風塢 & 雙子塔夜景', notes: '避風塢-藝術西區-文創市集海邊步道-觀看雙子塔亮燈\n18:30 藍調時刻與夜景拍照\n雙子塔外圍拍照、雲上廈門觀景台、俯瞰市區夜景', transitTime: '0', transitIcon: '💤' },

                    // Day 4
                    { id: 401, dIdx: 3, category: '景點', time: '08:00-19:00', title: '福建南靖土樓一日遊', notes: '8 人精緻頭等艙團|9 座豪華商務車,全程無購物、無強制消費\n08:00車程 ➔ 10:00 雲水謠景區(雲水謠古鎮、和貴樓、贈送登鐘興樓1-4樓)\n12:00 客家風味餐 ➔ 13:30 田螺坑土樓群「四菜一湯」觀景台、裕昌樓(東倒西歪樓)、塔下村・張氏家廟「德遠堂」', transitTime: '0', transitIcon: '💤' },

                    // Day 5
                    { id: 501, dIdx: 4, category: '交通', time: '09:00-10:20', title: '五通碼頭 ➔ 金門水頭碼頭', notes: '09:00 廈門五通碼頭出發 ➔ 09:35 抵達金門水頭碼頭(通關+領行李約30-60分鐘)', transitTime: '15', transitIcon: '🚗' },
                    { id: 502, dIdx: 4, category: '交通', time: '10:20', title: '尚義機場寄行李 + 租用機車', notes: '搭計程車約15分鐘抵達尚義機場寄存行李與租車。\n機車推薦名冊：\n① 金豐租車(機場服務檯)內取車方便(08:30-18:30)\n② 金門冠城租車(機場店)評價穩定\n③ 新燕租車(Xinyanzuchejichang)可甲租乙還\n④ ZOCHA金門機場無人店：24小時手機預約', transitTime: '15', transitIcon: '🛵' },
                    { id: 503, dIdx: 4, category: '景點', time: '10:50-11:50', title: '水頭聚落閩南古厝', notes: '必拍地標：得月樓、洋樓群、閩南古厝精美建築', transitTime: '10', transitIcon: '🍱' },
                    { id: 504, dIdx: 4, category: '美食', time: '12:00-13:30', title: '金城老街午餐與在地特產採買', notes: '享用廣東粥、牛肉麵、炒泡麵。\n順便採買伴手禮：貢糖、牛肉乾、麵線', transitTime: '10', transitIcon: '🎖️' },
                    { id: 505, dIdx: 4, category: '景點', time: '13:40-14:20', title: '莒光樓拍照登頂', notes: '金門代表性核心地標，預留充足拍照時間約 40 分鐘', transitTime: '10', transitIcon: '🥛' },
                    { id: 506, dIdx: 4, category: '美食', time: '14:30-15:00', title: '青草地鮮奶純淨品嚐', notes: '在地推薦品項：鮮奶、鮮奶冰淇淋、鮮奶茶', transitTime: '20', transitIcon: '✈️' },
                    { id: 507, dIdx: 4, category: '航班', time: '15:20-17:15', title: '機場還車託運 ➔ 返港飛高雄', notes: '15:20 回機場還車+領行李+辦理登機\n15:30-15:45 最晚抵達機場，17:15 金門飛高雄', transitTime: '0', transitIcon: '🏁' }
                ]);

                const expenses = ref([
                    { id: 1, amount: 260, title: '海大富自助海鮮', category: '美食' },
                    { id: 2, amount: 120, title: '九九木眼鏡定金', category: '購物' },
                    { id: 3, amount: 150, title: '南普陀素餅伴手禮', category: '購物' }
                ]);

                const newExpense = ref({ amount: null, title: '', category: '美食' });

                const posts = ref([
                    { id: 1, text: '手札記錄：\n今天順利完成了手冊行程的精確比對！包含 Day 1 的小港機場接駁，Day 1 九九木與天虹購物中心配眼鏡安排，以及 Day 5 各大租車店（金豐、冠城、新燕、ZOCHA）推薦行列表與青草地鮮奶（鮮奶、冰淇淋、鮮奶茶）的品嚐備忘。期待出發！✈️', img: 'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=800&q=80', date: '2026-06-11' }
                ]);

                const newPost = ref({ text: '', img: '' });

                const formItem = ref({ id: null, time: '', title: '', category: '景點', notes: '' });

                // 計算開銷
                const totalExpenseRMB = computed(() => expenses.value.reduce((sum, e) => sum + Number(e.amount || 0), 0));
                const totalExpenseTWD = computed(() => Math.round(totalExpenseRMB.value * 4.5));

                // 篩選行程
                const filteredSchedule = computed(() => {
                    let items = scheduleItems.value.filter(item => item.dIdx === activeDateIdx.value);
                    if (filterCategory.value !== '全部') {
                        items = items.filter(item => item.category === filterCategory.value);
                    }
                    return items.sort((a, b) => a.id - b.id);
                });

                // 一鍵相片與成員記憶載入
                onMounted(() => {
                    const savedPhotos = localStorage.getItem('vint_photo_urls');
                    if (savedPhotos) {
                        photoUrls.value = JSON.parse(savedPhotos);
                    }
                    
                    const savedMembers = localStorage.getItem('vint_members_data');
                    if (savedMembers) {
                        members.value = JSON.parse(savedMembers);
                    }
                    
                    isMounted.value = true;
                });

                const savePhotos = () => {
                    localStorage.setItem('vint_photo_urls', JSON.stringify(photoUrls.value));
                    triggerAlert('🌿 輕森系手記管理系統：\n自訂相片網址已成功一鍵儲存並記憶於您的瀏覽器！');
                    showPhotoConfig.value = false;
                };

                const resetPhotos = () => {
                    photoUrls.value = { banner: '', day1: '', day2: '', day3: '', day4: '', day5: '' };
                    localStorage.removeItem('vint_photo_urls');
                    triggerAlert('已重設為森林風預設照片路徑。');
                };

                // 開啟旅伴編輯
                const openMemberEditModal = (m) => {
                    editingMember.value = { ...m };
                    showMemberModal.value = true;
                };

                // 儲存旅伴資訊
                const saveMember = () => {
                    const idx = members.value.findIndex(item => item.id === editingMember.value.id);
                    if (idx !== -1) {
                        members.value[idx] = { ...editingMember.value };
                        localStorage.setItem('vint_members_data', JSON.stringify(members.value));
                        triggerAlert(`🎉 已儲存 ${editingMember.value.name} 的旅伴資料與自訂照片！`);
                    }
                    showMemberModal.value = false;
                };

                // 旅伴防破圖處理
                const handleMemberImageError = (e, member) => {
                    // 若設定的圖片失效，回到森系漸層和 Emoji
                    member.photo = '';
                };

                // 防破圖雙重備用機制
                const handleBannerError = (e) => {
                    e.target.src = 'https://images.unsplash.com/photo-1488646953014-85cb44e25828?auto=format&fit=crop&w=800&q=80';
                };

                const handleDayImageError = (e, dayNum) => {
                    const fallbacks = {
                        1: 'https://images.unsplash.com/photo-1544620347-c4fd4a3d5957?auto=format&fit=crop&w=800&q=80',
                        2: 'https://images.unsplash.com/photo-1569336415962-a4bd9f69cd83?auto=format&fit=crop&w=800&q=80',
                        3: 'https://images.unsplash.com/photo-1520250497591-112f2f40a3f4?auto=format&fit=crop&w=800&q=80',
                        4: 'https://images.unsplash.com/photo-1605810230434-7631ac76ec81?auto=format&fit=crop&w=800&q=80',
                        5: 'https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?auto=format&fit=crop&w=800&q=80'
                    };
                    e.target.src = fallbacks[dayNum] || fallbacks[4];
                };

                // 行程互動機制
                const openAddModal = () => {
                    isEditing.value = false;
                    formItem.value = { id: Date.now(), time: '12:00', title: '', category: '景點', notes: '' };
                    showModal.value = true;
                };

                const openEditModal = (item) => {
                    isEditing.value = true;
                    formItem.value = { ...item };
                    showModal.value = true;
                };

                const saveItem = () => {
                    if (!formItem.value.title) return triggerAlert('請填寫主題名稱');
                    if (isEditing.value) {
                        const idx = scheduleItems.value.findIndex(i => i.id === formItem.value.id);
                        if (idx !== -1) scheduleItems.value[idx] = { ...formItem.value };
                    } else {
                        formItem.value.dIdx = activeDateIdx.value;
                        scheduleItems.value.push({ ...formItem.value });
                    }
                    showModal.value = false;
                };

                const confirmDelete = () => {
                    scheduleItems.value = scheduleItems.value.filter(i => i.id !== formItem.value.id);
                    showModal.value = false;
                };

                const moveItem = (currentIdx, direction) => {
                    const targetIdx = currentIdx + direction;
                    if (targetIdx < 0 || targetIdx >= filteredSchedule.value.length) return;
                    const tempId = filteredSchedule.value[currentIdx].id;
                    filteredSchedule.value[currentIdx].id = filteredSchedule.value[targetIdx].id;
                    filteredSchedule.value[targetIdx].id = tempId;
                };

                // 記帳與日誌
                const addExpense = () => {
                    if (!newExpense.value.amount || !newExpense.value.title) return triggerAlert('請完整填寫金額與品項');
                    expenses.value.unshift({ id: Date.now(), ...newExpense.value });
                    newExpense.value.amount = null;
                    newExpense.value.title = '';
                };

                const deleteExpense = (id) => {
                    expenses.value = expenses.value.filter(e => e.id !== id);
                };

                const handleImage = (e) => {
                    const file = e.target.files[0];
                    if (file) {
                        const reader = new FileReader();
                        reader.onload = (el) => { newPost.value.img = el.target.result; };
                        reader.readAsDataURL(file);
                    }
                };

                const addPost = () => {
                    if (!newPost.value.text) return triggerAlert('請填寫日誌隨筆內文');
                    posts.value.unshift({
                        id: Date.now(),
                        text: newPost.value.text,
                        img: newPost.value.img || 'https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?auto=format&fit=crop&w=800&q=80',
                        date: new Date().toISOString().split('T')[0]
                    });
                    newPost.value.text = '';
                    newPost.value.img = '';
                };

                const openGoogleMap = (query) => {
                    window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(query)}`, '_blank');
                };

                const getBadgeColor = (cat) => {
                    switch(cat) {
                        case '航班': return 'bg-bookGold text-bookInk border-bookInk';
                        case '交通': return 'bg-bookBlue text-white border-bookInk';
                        case '住宿': return 'bg-bookGreen text-white border-bookInk';
                        case '美食': return 'bg-bookRed text-white border-bookInk';
                        default: return 'bg-stone-100 text-bookInk border-stone-300';
                    }
                };

                const getExpenseIcon = (cat) => {
                    switch(cat) {
                        case '交通': return '🚗';
                        case '美食': return '🍱';
                        case '住宿': return '🏨';
                        case '門票': return '🎟️';
                        case '購物': return '🛍️';
                        default: return '💰';
                    }
                };

                return {
                    isMounted, currentTab, activeDateIdx, filterCategory, pinCode, dates, categories, members, todos, expenses, newExpense, posts, newPost,
                    filteredSchedule, totalExpenseRMB, totalExpenseTWD, showModal, isEditing, formItem, showPhotoConfig, photoUrls, currentWeather, customAlert,
                    showMemberModal, editingMember,
                    openAddModal, openEditModal, saveItem, confirmDelete, moveItem, addExpense, deleteExpense, handleImage, addPost, openGoogleMap, getBadgeColor, getExpenseIcon,
                    handleBannerError, handleDayImageError, savePhotos, resetPhotos, triggerAlert,
                    openMemberEditModal, saveMember, handleMemberImageError
                };
            }
        }).mount('#app');
    </script>
